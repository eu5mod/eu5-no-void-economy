l_english:
 STATIC_MODIFIER_NAME_cbp_mandatory_stability_expense: "(CBP) Mandatory Stability Expense"
 STATIC_MODIFIER_DESC_cbp_mandatory_stability_expense: "A baseline Stability expense, progressively offset by positive Stability. Set the Stability budget slider to 50% at zero Stability to reproduce the vanilla zero-investment baseline."
 AUTO_MODIFIER_NAME_cbp_negative_stability_expense_offset: "(CBP) Negative Stability Expense Offset"
 AUTO_MODIFIER_DESC_cbp_negative_stability_expense_offset: "Negative Stability offsets part of the mandatory Stability expense. Positive Stability receives no additional penalty from this rule."
 STATIC_MODIFIER_NAME_cbp_mandatory_government_power_expense: "(CBP) Mandatory Government Power Expense"
 STATIC_MODIFIER_DESC_cbp_mandatory_government_power_expense: "An additional monthly decay for Legitimacy and equivalent government powers. Court spending maintains the active power at 66.7%, while maximum spending preserves the vanilla maximum monthly increase."
