l_english:
 cbp_q8_probe_debug.7.title: "ModeU5 Q8.7 Performance Relevant Shadow Probe"
 cbp_q8_probe_debug.7.desc: "Compare the PERF-14 human-relevant market list with a native global market pass filtered to the same relevant markets. Rebuilds present-country work caches and counts countries, but performs no stock mutation."
 cbp_q8_probe_debug.7.a: "Run Q8.7 performance relevant shadow probe"
 cbp_q8_probe_debug.8.title: "ModeU5 Q8.7 Performance Relevant Shadow Result"
 cbp_q8_probe_debug.8.desc: "The Q8.7 performance relevant shadow probe finished. Review debug.log or tools/summarize_cbp_logs.sh for the q87_performance_relevant_global_shadow_compare scenario markers."
 cbp_q8_probe_debug.result.q87_perf_relevant_shadow.pass: "PASS - Q8.7 performance relevant global shadow comparison"
 cbp_q8_probe_debug.result.q87_perf_relevant_shadow.fail: "FAIL - Q8.7 performance relevant global shadow comparison"
 cbp_q8_probe_debug.9.title: "ModeU5 Q8.7 Market Owner Workshape Shadow Probe"
 cbp_q8_probe_debug.9.desc: "Compare the current every_market_center_in_country owner shape with the candidate global market-local owner shape in Performance Mode. Counts market and present-country work only; it does not run US-00, US-10, trade owner work, generated-good loops, validation, or stock mutation."
 cbp_q8_probe_debug.9.a: "Run Q8.7 market owner workshape shadow probe"
 cbp_q8_probe_debug.10.title: "ModeU5 Q8.7 Market Owner Workshape Shadow Result"
 cbp_q8_probe_debug.10.desc: "The Q8.7 market owner workshape shadow probe finished. Review debug.log or tools/summarize_cbp_logs.sh for the q87_performance_market_owner_workshape_shadow scenario markers."
 cbp_q8_probe_debug.result.q87_workshape_shadow.pass: "PASS - Q8.7 performance market owner workshape shadow"
 cbp_q8_probe_debug.result.q87_workshape_shadow.fail: "FAIL - Q8.7 performance market owner workshape shadow"
 cbp_q8_probe_debug.11.title: "ModeU5 Q8.7 No-op Dispatcher Shadow Probe"
 cbp_q8_probe_debug.11.desc: "Compare the current market-center dispatcher reference with the candidate global market-local dispatcher shape in Performance Mode. Counts cache rebuilds, capacity-pass shape, US-00 pass shape, and US-10 pass shape; it does not run generated-good helpers, trade owner work, validation, or stock mutation."
 cbp_q8_probe_debug.11.a: "Run Q8.7 no-op dispatcher shadow probe"
 cbp_q8_probe_debug.12.title: "ModeU5 Q8.7 No-op Dispatcher Shadow Result"
 cbp_q8_probe_debug.12.desc: "The Q8.7 no-op dispatcher shadow probe finished. Review debug.log or tools/summarize_cbp_logs.sh for the q87_performance_noop_dispatcher_shadow scenario markers."
 cbp_q8_probe_debug.result.q87_noop_dispatcher_shadow.pass: "PASS - Q8.7 performance no-op dispatcher shadow"
 cbp_q8_probe_debug.result.q87_noop_dispatcher_shadow.fail: "FAIL - Q8.7 performance no-op dispatcher shadow"
