name: Finalize US04 Sparse Contract

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: perf/sparse-us04-work-indexes
          fetch-depth: 0

      - name: Align documentation and validators
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          impl_path = Path('docs/performance/US04_SPARSE_WORK_INDEX_IMPLEMENTATION.md')
          impl = impl_path.read_text(encoding='utf-8')
          start = impl.index('The list targets location scopes.')
          end = impl.index('The list is a scheduling index only.', start)
          membership = (
              'The list targets location scopes. A location is a member for one good when either\n'
              'branch is true:\n\n'
              '1. `cbp_us04_reconciliation_coefficient[good]` exists and differs from `1`,\n'
              '   **and** at least one location-good Estate proxy map entry exists;\n'
              '2. a prior US-04 monthly reconciliation record still exists and must be cleared.\n\n'
          )
          impl = impl[:start] + membership + impl[end:]
          impl = impl.replace('- coefficient/proxy activity;', '- coefficient **and** proxy activity;', 1)
          impl = impl.replace(
              'Generated annual coefficient writes refresh the corresponding good immediately\n'
              'through the all-goods annual wrapper. Any external coefficient or Estate-proxy\n'
              'writer must call:',
              'Generated annual coefficient writes refresh the corresponding good immediately\n'
              'through the all-goods annual wrapper. The loaded Estate-proxy writers and reset\n'
              'surfaces also refresh the corresponding good immediately. Any additional external\n'
              'coefficient or Estate-proxy writer must call:',
              1,
          )
          impl = impl.replace(
              'entry remains only while one of the three membership conditions is still true.',
              'entry remains only while the coefficient-and-proxy branch or the prior-record branch is true.',
              1,
          )
          impl_path.write_text(impl, encoding='utf-8')

          replace_once(
              'docs/technical/PERSISTENT_STATE_AUDIT.md',
              'membership means coefficient differs from 1, Estate proxy exists, or prior record needs clearing',
              'membership means coefficient differs from 1 and an Estate proxy exists, or a prior record needs clearing',
          )
          replace_once(
              'docs/technical/PERSISTENT_STATE_AUDIT.md',
              'remove entry when coefficient=1 and no proxy or prior record remains; clear/rebuild after load generation changes',
              'remove entry when coefficient=1 or no proxy remains, unless a prior record still needs clearing; clear/rebuild after load generation changes',
          )
          replace_once(
              'tools/audit_cbp_persistent_state.sh',
              'remove when no active coefficient, proxy, or prior record remains',
              'remove when no coefficient-and-proxy activity or prior record remains',
          )
          replace_once(
              'docs/architecture/RUNTIME_FLOW.md',
              'US04ACTIVE -->|yes| DELTA["existing location-good signed delta = coefficient - 1"]',
              'US04ACTIVE -->|yes| DELTA["coefficient differs from 1 AND proxy exists<br/>existing signed delta = coefficient - 1"]',
          )
          replace_once(
              'docs/architecture/RUNTIME_FLOW.md',
              'CLEAROLD --> US04PRUNE["refresh membership; prune when coefficient=1,<br/>no proxy and no prior record"]',
              'CLEAROLD --> US04PRUNE["refresh membership; prune when coefficient=1 OR no proxy,<br/>unless a prior record still needs clearing"]',
          )

          validator_path = Path('tools/validate_cbp_us04_sparse_indexes.py')
          validator = validator_path.read_text(encoding='utf-8')
          if 'DEMAND_RESOLVER = ROOT /' not in validator:
              validator = validator.replace(
                  'TEMPLATE = ROOT / "tools/templates/cbp_us04_pop_demand_good.template.txt"\n',
                  'TEMPLATE = ROOT / "tools/templates/cbp_us04_pop_demand_good.template.txt"\n'
                  'DEMAND_RESOLVER = ROOT / "in_game/common/scripted_effects/cbp_stock_demand_resolver_effects.txt"\n',
                  1,
              )
          if 'demand_resolver = read(DEMAND_RESOLVER)' not in validator:
              validator = validator.replace(
                  '    template = read(TEMPLATE)\n',
                  '    template = read(TEMPLATE)\n    demand_resolver = read(DEMAND_RESOLVER)\n',
                  1,
              )
          if 'proxy writer cbp_reset_us04_location_estate_proxy' not in validator:
              marker = '    # The generated output must contain one country-owned sparse list surface and\n'
              insert = (
                  '    require(generator, \'"\\\\t\\\\t\\\\t\\\\t\\\\t\\\\tAND = {",\', "activity membership")\n\n'
                  '    for writer in (\n'
                  '        "cbp_reset_us04_location_estate_proxy",\n'
                  '        "cbp_record_us04_location_estate_proxy_peasants_estate",\n'
                  '        "cbp_record_us04_location_estate_proxy_burghers_estate",\n'
                  '        "cbp_record_us04_location_estate_proxy_nobles_estate",\n'
                  '        "cbp_record_us04_location_estate_proxy_clergy_estate",\n'
                  '        "cbp_reset_pop_demand_outcome",\n'
                  '    ):\n'
                  '        writer_body = effect_body(demand_resolver, writer)\n'
                  '        require(\n'
                  '            writer_body,\n'
                  '            "cbp_us04_refresh_location_sparse_index_good_$good$ = yes",\n'
                  '            f"proxy writer {writer}",\n'
                  '        )\n\n'
              )
              if marker not in validator:
                  raise SystemExit('custom validator insertion marker missing')
              validator = validator.replace(marker, insert + marker, 1)
          if '"coefficient **and** proxy activity",' not in validator:
              validator = validator.replace(
                  '        "prior monthly record",\n',
                  '        "prior monthly record",\n        "coefficient **and** proxy activity",\n',
                  1,
              )
          validator_path.write_text(validator, encoding='utf-8')

          Path('.github/workflows/finalize-us04-sparse-contract.yml').unlink()
          PY

      - name: Commit contract alignment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Docs: align sparse US-04 admission contract"
          git push origin HEAD:perf/sparse-us04-work-indexes
