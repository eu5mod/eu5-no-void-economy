name: US04 Sparse Indexes

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate US-04 helpers
        run: bash tools/generate_us04_pop_demand_helpers.sh

      - name: Validate sparse US-04 work indexes
        run: python3 tools/validate_cbp_us04_sparse_indexes.py

      - name: Audit persistent state inventory
        run: bash tools/audit_cbp_persistent_state.sh
