name: Generate DDS assets

on:
  push:
    paths:
      - 'docs/assets/**/*.svg'
      - 'docs/assets/**/*.png'
      - 'tools/generate_dds_assets.sh'
      - '.github/workflows/generate-dds-assets.yml'
  pull_request:
    paths:
      - 'docs/assets/**/*.svg'
      - 'docs/assets/**/*.png'
      - 'docs/assets/**/*.dds'
      - 'tools/generate_dds_assets.sh'
      - '.github/workflows/generate-dds-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-dds-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick

      - name: Validate DDS asset generation
        run: bash tools/generate_dds_assets.sh --check
