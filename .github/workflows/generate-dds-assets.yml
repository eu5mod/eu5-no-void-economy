name: Generate DDS assets

on:
  push:
    paths:
      - 'docs/assets/**/*.svg'
      - 'docs/assets/**/*.png'
      - 'tools/generate_dds_assets.sh'
      - '.github/workflows/generate-dds-assets.yml'
  pull_request:
    paths:
      - 'docs/assets/**/*.svg'
      - 'docs/assets/**/*.png'
      - 'docs/assets/**/*.dds'
      - 'tools/generate_dds_assets.sh'
      - '.github/workflows/generate-dds-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-dds-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick

      - name: Validate generated DDS assets on pull requests
        if: github.event_name == 'pull_request'
        run: bash tools/generate_dds_assets.sh --check

      - name: Generate DDS assets on branch pushes
        if: github.event_name != 'pull_request'
        run: bash tools/generate_dds_assets.sh

      - name: Commit generated DDS assets
        if: github.event_name != 'pull_request'
        run: |
          if [[ -z "$(git status --porcelain -- docs/assets)" ]]; then
            echo "DDS assets already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets
          git commit -m "Generate DDS copies for source image assets"
          git push
