name: Audit generated CBP variables

on:
  pull_request:
    branches:
      - us-17-trade-reconciliation
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'refactor/cbp-variable-prefixes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate outputs
        run: ./tools/generate_all.sh

      - name: Audit generated variable names
        shell: bash
        run: |
          mkdir -p generated-cbp-audit
          set +e
          python3 tools/cbp_variable_prefixes.py --check \
            > generated-cbp-audit/prefix-check.log 2>&1
          grep -RhoE '(modeu5_|nve_)[A-Za-z0-9_$]+' \
            in_game/common/scripted_effects/modeu5_stock_goods_generated.txt \
            in_game/common/scripted_effects/modeu5_zz_pr71_active_good_dispatch_generated.txt \
            in_game/common/scripted_effects/modeu5_us20_promoted_destination_receipt_dispatchers.txt \
            in_game/gui/modeu5_us10_stock_table.gui \
            in_game/common/scripted_effects/modeu5_us10_ui_market_production_effects.txt \
            | sort -u > generated-cbp-audit/all-legacy-tokens.txt || true
          cp in_game/common/scripted_effects/modeu5_stock_goods_generated.txt \
             generated-cbp-audit/modeu5_stock_goods_generated.txt
          cat generated-cbp-audit/prefix-check.log
          exit 0

      - name: Upload generated-variable audit
        uses: actions/upload-artifact@v4
        with:
          name: generated-cbp-variable-audit
          path: generated-cbp-audit/
