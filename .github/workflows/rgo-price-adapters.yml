name: RGO Price Adapters

on:
  push:
  pull_request:

jobs:
  validate-rgo-price-adapters:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test fixed and percentage-offset adapters
        run: python3 -m unittest tools.cbg.adapters.cbp.tests.test_rgo_price_adapters

      - name: Validate environment contract
        run: |
          grep -q '^MODEU5_US09_RGO_PRICE_ADAPTER=fixed$' .cbp.local.env.template
          grep -q '^MODEU5_US09_RGO_FIXED_PRICE=60 ' .cbp.local.env.template
          grep -q '^MODEU5_US09_RGO_PRICE_OFFSET_PERCENT=' .cbp.local.env.template
