name: CBG Database Entry Outputs

on:
  push:
  pull_request:

jobs:
  validate-database-entry-outputs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test selected-object REPLACE and INJECT packaging
        run: >-
          python3 -m unittest
          tools.tests.test_replace_object_outputs
          tools.cbg.adapters.cbp.tests.test_building_spec
