name: CBP Variable Prefixes

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate repository outputs
        run: ./tools/generate_all.sh

      - name: Exclude generated vanilla overrides from CBP scan
        shell: bash
        run: |
          set -euo pipefail
          if [ -d packages/cbp_economy_rebalance/in_game/common ]; then
            while IFS= read -r -d '' generated_file; do
              if head -n 1 "$generated_file" | grep -qx '# Generated by tools/generate_us09_economy_overrides.sh.'; then
                rm -f "$generated_file"
              fi
            done < <(find packages/cbp_economy_rebalance/in_game/common -type f -name '*.txt' -print0)
          fi

          # Exact-path balance overrides intentionally preserve Vanilla script
          # objects, including Vanilla-owned variable names. Remove every path
          # owned by their manifests before applying the CBP-authored-variable
          # contract to the remaining package code.
          python3 - <<'PY'
          import json
          from pathlib import Path

          package_root = Path('packages/cbp_economy_rebalance')
          manifest_root = package_root / 'cbp_generated'
          for manifest_name in (
              'political_reward_overrides_manifest.json',
              'us177_minting_income_manifest.json',
              'us177_minting_building_manifest.json',
          ):
              manifest = manifest_root / manifest_name
              if not manifest.is_file():
                  continue
              payload = json.loads(manifest.read_text(encoding='utf-8'))
              for item in payload.get('files', []):
                  relative = item.get('path')
                  if not isinstance(relative, str):
                      continue
                  generated = package_root / relative
                  if generated.is_file():
                      generated.unlink()
          PY

      - name: Validate CBP variable-prefix contract
        id: validate
        shell: bash
        run: |
          set +e
          python3 tools/cbp_variable_prefixes.py --check > cbp-prefix-validation.log 2>&1
          status=$?
          cat cbp-prefix-validation.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbp-prefix-validation-log
          path: cbp-prefix-validation.log

      - name: Fail invalid contract
        if: steps.validate.outputs.status != '0'
        run: exit 1
