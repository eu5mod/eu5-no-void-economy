name: CBP Variable Prefixes

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate CBP variable-prefix contract
        run: python3 tools/cbp_variable_prefixes.py --check
