name: Apply Location Warning UX

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/cbg-replace-object-prefixed-outputs
          fetch-depth: 0

      - name: Apply warning UX patch
        run: python3 tools/maintenance/apply_location_warning_ux.py

      - name: Validate warning behavior
        run: |
          python3 -m unittest tools.cbg.adapters.cbp.tests.test_location_static_modifiers
          bash -n tools/generate_cbp_location_overrides.sh
          bash -n tools/generate_all.sh

      - name: Commit changes
        run: |
          rm .github/workflows/apply-location-warning-ux.yml
          rm tools/maintenance/apply_location_warning_ux.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "UX: make optional location warnings actionable"
          git push origin HEAD:feature/cbg-replace-object-prefixed-outputs
