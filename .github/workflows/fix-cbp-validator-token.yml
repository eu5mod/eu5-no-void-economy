name: Fix CBP validator token

on:
  pull_request:
    branches:
      - us-17-trade-reconciliation
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: fix-cbp-validator-token
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'refactor/cbp-variable-prefixes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stacked branch
        uses: actions/checkout@v4
        with:
          ref: refactor/cbp-variable-prefixes
          fetch-depth: 0

      - name: Correct runtime map assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/validate_generators.sh')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "test_cbp_consumption_wheat_pending_requested_by_market",
              "cbp_consumption_wheat_pending_requested_by_market",
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate outputs
        run: ./tools/generate_all.sh

      - name: Validate and capture diagnostics
        id: validate
        shell: bash
        run: |
          set +e
          mkdir -p cbp-validator-token-logs
          {
            python3 tools/cbp_variable_prefixes.py --check
            ./tools/validate_generators.sh
            ./tools/validate_module_packages.sh
            ./tools/audit_modeu5_persistent_state.sh
            python3 ./tools/validate_ci_static_contracts.py
            git diff --check
          } > cbp-validator-token-logs/validation.log 2>&1
          status=$?
          cat cbp-validator-token-logs/validation.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbp-validator-token-diagnostics
          path: cbp-validator-token-logs/

      - name: Commit validator correction
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/validate_generators.sh
          git commit -m 'Correct CBP runtime map validator token'
          git push origin HEAD:refactor/cbp-variable-prefixes

      - name: Fail remaining validation error
        if: steps.validate.outputs.status != '0'
        run: exit 1
