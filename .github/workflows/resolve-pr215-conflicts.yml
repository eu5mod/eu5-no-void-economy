name: Resolve PR 215 Conflicts

on:
  push:
    branches:
      - perf/sparse-us04-work-indexes

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: perf/sparse-us04-work-indexes
          fetch-depth: 0

      - name: Merge current base and resolve expected conflicts
        run: |
          set -euo pipefail
          git fetch origin fix/pr170-optional-vanilla-profit-margins

          set +e
          git merge --no-commit --no-ff origin/fix/pr170-optional-vanilla-profit-margins
          merge_status=$?
          set -e

          if [[ "$merge_status" -eq 0 ]]; then
            echo "Base merged without conflicts; resolver is no longer needed."
          else
            expected_conflicts=$'docs/architecture/RUNTIME_FLOW.md\ndocs/technical/PERSISTENT_STATE_AUDIT.md\ntools/audit_cbp_persistent_state.sh'
            actual_conflicts="$(git diff --name-only --diff-filter=U | sort)"
            if [[ "$actual_conflicts" != "$expected_conflicts" ]]; then
              echo "Unexpected conflict set:" >&2
              printf '%s\n' "$actual_conflicts" >&2
              exit 1
            fi

            python3 - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import subprocess

          RUNTIME = Path("docs/architecture/RUNTIME_FLOW.md")
          STATE = Path("docs/technical/PERSISTENT_STATE_AUDIT.md")
          AUDIT = Path("tools/audit_cbp_persistent_state.sh")


          def staged(path: Path, stage: int) -> str:
              return subprocess.check_output(
                  ["git", "show", f":{stage}:{path.as_posix()}"],
                  text=True,
              )


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)


          # Runtime flow: retain the current base's three-phase orchestration and
          # trade gate, then transplant PR #215's sparse US-04 lifecycle and owner.
          runtime = staged(RUNTIME, 3)

          runtime = replace_once(
              runtime,
              '        GSP --> US04INIT["Initialize demand multipliers once<br/>cbp_initialize_pop_demand_multipliers_once"]\n',
              '        GSP --> US04INIT["Initialize demand multipliers once<br/>cbp_initialize_pop_demand_multipliers_once"]\n'
              '        GSP --> US04GEN0["Invalidate sparse US-04 indexes for this load generation<br/>cbp_advance_us04_sparse_index_load_generation"]\n',
              "game-start sparse generation",
          )
          runtime = replace_once(
              runtime,
              '        GLP --> LOADREPAIR["Repair lifecycle and missing demand-adaptation state<br/>cbp_repair_stock_lifecycle_on_game_load"]\n',
              '        GLP --> US04GENL["Invalidate sparse US-04 indexes for this load generation<br/>cbp_advance_us04_sparse_index_load_generation"]\n'
              '        GLP --> LOADREPAIR["Repair lifecycle and missing demand-adaptation state<br/>cbp_repair_stock_lifecycle_on_game_load"]\n',
              "game-load sparse generation",
          )

          monthly_start = runtime.index('        TNEXT --> US04M0[')
          monthly_end = runtime.index('        US04END --> AUDIT', monthly_start)
          monthly_block = '''        TNEXT --> US04M0["Run monthly sparse Estate-demand reconciliation<br/>cbp_run_monthly_us04_reconciliation_for_current_country"]

          subgraph US04MONTH["Monthly sparse Estate-demand reconciliation (US-04)"]
              direction TB
              US04M0 --> US04MGATE{"Runtime ready and demand rebalance enabled?<br/>cbp_stock_runtime_ready_trigger<br/>cbp_pop_consumption_offer_demand_enabled_trigger"}
              US04MGATE -->|no| US04MSKIP["Exit without Estate-demand mutation<br/>cbp_run_monthly_us04_estate_accounting_for_current_country"]
              US04MGATE -->|yes| US04PREP["Prepare current-country sparse index<br/>cbp_prepare_us04_sparse_index_for_current_country"]
              US04PREP --> US04REBUILD{"Country sparse-index generation stale?<br/>cbp_us04_sparse_index_load_generation"}
              US04REBUILD -->|yes| US04DENSE["Rebuild current-country sparse lists once<br/>cbp_rebuild_us04_sparse_index_for_current_country<br/>every_owned_location"]
              US04REBUILD -->|no| US04LISTS["Reuse country-owned per-good active-location lists"]
              US04DENSE --> US04LISTS
              US04LISTS --> US04GOODS["Process supported goods through sparse dispatch<br/>cbp_monthly_process_us04_sparse_index_all_goods"]
              US04GOODS --> US04LOC["Iterate active locations for each good<br/>every_in_list: cbp_<good>_us04_active_locations"]
              US04LOC --> US04OWNER{"Location still owned by current country?"}
              US04OWNER -->|no| US04REMOVE["Remove stale list membership<br/>cbp_us04_remove_location_from_country_sparse_index_good_<good>"]
              US04OWNER -->|yes| US04STATE["Re-read coefficient, Estate proxy and prior record"]
              US04STATE --> US04ACTIVE{"Coefficient differs from 1 AND proxy exists<br/>and current market demands the good?"}
              US04ACTIVE -->|yes| DELTA["Apply existing signed delta<br/>coefficient - 1"]
              US04ACTIVE -->|no| CLEAROLD["Clear prior monthly record if present"]
              DELTA --> SIGN{"delta sign?"}
              SIGN -->|positive| REMOVE["cbp_remove_stock(actual satisfiable delta)<br/>country + market aggregate + negative goods supply"]
              REMOVE --> CHARGE["market price x actual removed<br/>negative add_gold_to_estate by Estate share"]
              SIGN -->|negative| RESTORE["cbp_add_stock(restored delta)<br/>country + market aggregate + positive goods supply"]
              RESTORE --> REFUND["market price x actual restored<br/>positive add_gold_to_estate by Estate share"]
              SIGN -->|zero / missing proxy| NOOP["no mutation / diagnostic record"]
              CHARGE --> US04STORE["Clear and store monthly per-good reconciliation record"]
              REFUND --> US04STORE
              NOOP --> US04STORE
              CLEAROLD --> US04PRUNE["Refresh membership; prune when coefficient=1 OR no proxy,<br/>unless a prior record still needs clearing"]
              US04STORE --> US04PRUNE
              US04REMOVE --> US04NEXT["Sparse entry complete"]
              US04PRUNE --> US04NEXT
              US04NEXT --> US04END["Estate-demand reconciliation complete"]
              US04MSKIP --> US04END
          end

          '''
          runtime = runtime[:monthly_start] + monthly_block + runtime[monthly_end:]

          yearly_start = runtime.index('    subgraph YEARLY["Yearly demand-coefficient adaptation (US-04)"]')
          yearly_end = runtime.index('    subgraph PERIODIC[', yearly_start)
          yearly_and_owner = '''    subgraph YEARLY["Yearly demand adaptation and sparse-index verification (US-04)"]
              direction TB
              Y0["yearly_country_pulse"] --> YP["Run yearly demand-adaptation pulse<br/>cbp_yearly_pop_demand_adaptation_pulse"]
              YP --> YINIT["Initialize current-country demand multipliers once<br/>cbp_initialize_pop_demand_multipliers_for_current_country_once"]
              YINIT --> YCMM["Refresh live demand integration marker<br/>cbp_refresh_pop_demand_live_integration_from_cmm_country_scope"]
              YCMM --> YRUN["Adapt yearly demand coefficients<br/>cbp_run_yearly_pop_demand_adaptation_for_current_country"]
              YRUN --> YGATE{"Runtime ready and demand rebalance enabled?<br/>cbp_stock_runtime_ready_trigger<br/>cbp_pop_consumption_offer_demand_enabled_trigger"}
              YGATE -->|no| YSKIP["Exit without coefficient mutation<br/>cbp_run_yearly_pop_demand_adaptation_for_current_country"]
              YGATE -->|yes| YCLEAR["Clear current-country per-good active-location lists<br/>cbp_us04_clear_sparse_index_for_current_country"]
              YCLEAR --> YLOC["Iterate owned locations<br/>every_owned_location"]
              YLOC --> YGOOD["Adjust all supported goods<br/>cbp_annual_adjust_location_pop_demand_all_goods"]
              YGOOD --> YREAD["read annual satisfied and unsatisfied counters"]
              YREAD --> YCASE{"annual outcome?"}
              YCASE -->|12 satisfied / 0 shortage| YUP["coefficient x 1.01"]
              YCASE -->|0 satisfied / 12 shortage| YDOWN["coefficient x 0.99"]
              YCASE -->|mixed / no observation| YSAME["coefficient unchanged"]
              YUP --> YWRITE["persist location x good coefficient"]
              YDOWN --> YWRITE
              YSAME --> YWRITE
              YWRITE --> YRESET["reset annual counters"]
              YRESET --> YINDEX["Refresh location-good sparse membership"]
              YINDEX --> YSTAMP["Store current sparse-index generation"]
          end

          subgraph US04OWNERREPAIR["US-04 ownership-change repair"]
              direction TB
              O0["Location owner changed<br/>on_location_changed_owner"] --> OCORE["Run CORE-03 stock succession<br/>cbp_core03_handle_location_changed_owner"]
              OCORE --> OUS04["Repair sparse US-04 ownership<br/>cbp_us04_handle_location_changed_owner"]
              OUS04 --> ORESTORE["Remove from loser lists and re-evaluate for winner"]
          end

          '''
          runtime = runtime[:yearly_start] + yearly_and_owner + runtime[yearly_end:]

          runtime = replace_once(
              runtime,
              '| 6 | Monthly US-04 reconciliation | Apply only the signed coefficient delta; US-10 already owns base consumption. |',
              '| 6 | Monthly US-04 sparse dispatcher | Select active location-good entries, then apply the unchanged signed coefficient delta; US-10 already owns base consumption. |',
              "monthly ordering row",
          )
          runtime = replace_once(
              runtime,
              '| 9 | Yearly US-04 pulse | Evolve coefficients after reading annual outcomes, then reset counters. |',
              '| 9 | Yearly US-04 pulse | Evolve coefficients, reset annual counters, and completely rebuild sparse membership. |',
              "yearly ordering row",
          )
          runtime = replace_once(
              runtime,
              '| US-04 coefficient | Location x good | Durable Rebalance Economy state |\n'
              '| US-04 monthly Estate totals | Current country x market x good | Monthly ledger/diagnostic state |',
              '| US-04 coefficient | Location x good | Durable Rebalance Economy state |\n'
              '| `cbp_<good>_us04_active_locations` | Country, targeting locations | Persistent scheduling index; never coefficient, stock, quantity, or mutation source |\n'
              '| US-04 sparse load generation | Global generation plus country copy | Rebuild scheduling scalar only |\n'
              '| US-04 monthly Estate totals | Current location x good record | Monthly ledger state retained until clear/store/prune |',
              "monthly ownership rows",
          )
          runtime = replace_once(
              runtime,
              '- Rebalance Economy owns US-04. Its absence or disabled CMM option makes both\n'
              '  monthly reconciliation and yearly coefficient adaptation no-ops.\n',
              '- Rebalance Economy owns US-04. Its absence or disabled CMM option makes both\n'
              '  monthly reconciliation and yearly coefficient adaptation no-ops.\n'
              '- Sparse US-04 country-owned per-good active-location lists change only work\n'
              '  selection. Every indexed entry is revalidated before economic mutation.\n'
              '- The ownership-change repair removes transferred locations from the loser and\n'
              '  re-evaluates them for the winner. A prior record keeps an entry indexed until\n'
              '  it is explicitly cleared.\n',
              "package boundaries",
          )
          runtime = replace_once(
              runtime,
              '| US-04 monthly/yearly entry points | `in_game/common/scripted_effects/cbp_us04_pop_demand_effects.txt` |\n'
              '| Generated US-04 per-good accounting | `tools/templates/cbp_us04_pop_demand_good.template.txt` |',
              '| US-04 monthly/yearly sparse owners | `in_game/common/scripted_effects/cbp_us04_pop_demand_effects.txt` |\n'
              '| US-04 ownership-change hook | `in_game/common/on_action/cbp_core03_exposure_on_actions.txt` |\n'
              '| Generated US-04 per-good accounting | `tools/templates/cbp_us04_pop_demand_good.template.txt` |\n'
              '| Generated sparse US-04 list dispatch | `tools/generate_us04_pop_demand_helpers.sh` |',
              "source map",
          )
          RUNTIME.write_text(runtime, encoding="utf-8")

          # Persistent-state documentation: retain PR #215 and add the #214
          # country-market capacity scheduling stamp contract.
          state = staged(STATE, 2)
          state = replace_once(
              state,
              '| `cbp_foreign_capacity_by_market` | country | market | durable capacity breakdown | US-02, UI/debug | capacity explanation and future foreign-storage hook | keep |\n',
              '| `cbp_foreign_capacity_by_market` | country | market | durable capacity breakdown | US-02, UI/debug | capacity explanation and future foreign-storage hook | keep |\n'
              '| `cbp_capacity_monthly_stamp_by_market` | country | market | monthly scheduling stamp | US-02 monthly preparation and promoted-market capacity pass | prevents duplicate country-market capacity calculation and map writes within one month | keep while monthly idempotence uses it; never capacity source |\n',
              "capacity map classification",
          )
          state = replace_once(
              state,
              '| `cbp_foreign_capacity_by_market` | capacity breakdown | country | capacity refresh, initialization, owner/rank/capital hooks | replace during capacity refresh |\n',
              '| `cbp_foreign_capacity_by_market` | capacity breakdown | country | capacity refresh, initialization, owner/rank/capital hooks | replace during capacity refresh |\n'
              '| `cbp_capacity_monthly_stamp_by_market` | scheduling stamp | country | every successful country-market capacity refresh | overwrite with current month; missing or stale entry forces recalculation |\n',
              "capacity reset classification",
          )
          state = replace_once(
              state,
              '`cbp_<good>_us04_active_locations` is also scheduling state only. Membership\n',
              '`cbp_capacity_monthly_stamp_by_market` is scheduling state only. Capacity maps\n'
              'remain authoritative for admission and UI. A matching stamp means those maps\n'
              'were already refreshed in the current month; it is not itself evidence of any\n'
              'capacity value. Forced initialization and topology hooks bypass the monthly gate,\n'
              'rewrite the capacity maps, and overwrite the stamp.\n\n'
              '`cbp_<good>_us04_active_locations` is also scheduling state only. Membership\n',
              "capacity scheduling explanation",
          )
          state = replace_once(
              state,
              'Capacity breakdown maps: kept\n',
              'Capacity breakdown maps: kept\nCapacity scheduling stamps: kept while required for idempotence\n',
              "capacity target summary",
          )
          STATE.write_text(state, encoding="utf-8")

          # Executable inventory: retain PR #215's sparse-list discovery and add
          # #214's capacity stamp to the accepted inventory.
          audit = staged(AUDIT, 2)
          audit = replace_once(
              audit,
              'cbp_building_capacity_by_market\tvariable map\tcapacity breakdown\tcountry\tcapacity refresh / init / owner-rank-capital hooks\treplace during capacity refresh\twith capacity refresh\n',
              'cbp_building_capacity_by_market\tvariable map\tcapacity breakdown\tcountry\tcapacity refresh / init / owner-rank-capital hooks\treplace during capacity refresh\twith capacity refresh\n'
              'cbp_capacity_monthly_stamp_by_market\tvariable map\tmonthly scheduling stamp\tcountry\tevery successful country-market capacity refresh\toverwrite on refresh; stale month forces recalculation\tcountry-market capacity idempotence guard\n',
              "capacity executable inventory",
          )
          AUDIT.write_text(audit, encoding="utf-8")
          PY

            git add docs/architecture/RUNTIME_FLOW.md \
              docs/technical/PERSISTENT_STATE_AUDIT.md \
              tools/audit_cbp_persistent_state.sh
          fi

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved conflicts remain:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

      - name: Validate merged contracts
        run: |
          set -euo pipefail
          bash tools/generate_us04_pop_demand_helpers.sh
          python3 tools/validate_cbp_us04_sparse_indexes.py
          python3 tools/validate_us04_pop_demand_architecture.py
          python3 tools/validate_cbp_capacity_monthly_stamp.py
          bash tools/audit_cbp_persistent_state.sh
          git diff --check

      - name: Commit resolved merge
        run: |
          set -euo pipefail
          rm .github/workflows/resolve-pr215-conflicts.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Merge current base into sparse US-04 indexes"
          git push origin HEAD:perf/sparse-us04-work-indexes
