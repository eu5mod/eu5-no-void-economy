name: Fix generated stock variable prefixes

on:
  pull_request:
    branches:
      - us-17-trade-reconciliation
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: fix-generated-stock-variable-prefixes
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'refactor/cbp-variable-prefixes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stacked branch
        uses: actions/checkout@v4
        with:
          ref: refactor/cbp-variable-prefixes
          fetch-depth: 0

      - name: Correct generator-owned variable prefixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          generator = Path('tools/generate_stock_good_helpers.sh')
          text = generator.read_text(encoding='utf-8')

          replacements = {
              '"STOCK_MAP=modeu5_${good}_stock_by_market"': '"STOCK_MAP=cbp_${good}_stock_by_market"',
              '"MARKET_MAP=modeu5_${good}_market_stock"': '"MARKET_MAP=cbp_${good}_market_stock"',
              '"DIRTY_LIST=modeu5_${good}_dirty_markets"': '"DIRTY_LIST=cbp_${good}_dirty_markets"',
              '"ACTIVE_LIST=modeu5_${good}_active_markets"': '"ACTIVE_LIST=cbp_${good}_active_markets"',
              '"SPARSE_SUPPLIER_LIST=modeu5_${good}_us10_sparse_suppliers"': '"SPARSE_SUPPLIER_LIST=cbp_${good}_us10_sparse_suppliers"',
              '"PRODUCED_MAP=modeu5_${good}_produced_by_market"': '"PRODUCED_MAP=cbp_${good}_produced_by_market"',
              '"ADDED_MAP=modeu5_${good}_added_by_market"': '"ADDED_MAP=cbp_${good}_added_by_market"',
              '"REJECTED_MAP=modeu5_${good}_rejected_by_market"': '"REJECTED_MAP=cbp_${good}_rejected_by_market"',
              '"OVERPRODUCTION_RATIO_MAP=modeu5_${good}_overproduction_ratio_by_market"': '"OVERPRODUCTION_RATIO_MAP=cbp_${good}_overproduction_ratio_by_market"',
              '"EFFECTIVE_OVERPRODUCTION_RATIO_MAP=modeu5_${good}_effective_overproduction_ratio_by_market"': '"EFFECTIVE_OVERPRODUCTION_RATIO_MAP=cbp_${good}_effective_overproduction_ratio_by_market"',
              '"VOID_WEALTH_MAP=modeu5_${good}_void_wealth_by_market"': '"VOID_WEALTH_MAP=cbp_${good}_void_wealth_by_market"',
              '"VOID_TAXABLE_PROXY_MAP=modeu5_${good}_void_taxable_income_proxy_by_market"': '"VOID_TAXABLE_PROXY_MAP=cbp_${good}_void_taxable_income_proxy_by_market"',
              '"PRODUCTION_PENALTY_MAP=modeu5_${good}_production_penalty_by_market"': '"PRODUCTION_PENALTY_MAP=cbp_${good}_production_penalty_by_market"',
              '"US00_ACTIVE_MAP=modeu5_${good}_us00_active_record_by_market"': '"US00_ACTIVE_MAP=cbp_${good}_us00_active_record_by_market"',
              '"UI_MONTHLY_SURPLUS_MAP=modeu5_${good}_ui_monthly_surplus_by_market"': '"UI_MONTHLY_SURPLUS_MAP=gui_cbp_${good}_ui_monthly_surplus_by_market"',
              '"UI_MONTHLY_CONSUMPTION_MAP=modeu5_${good}_ui_monthly_consumption_by_market"': '"UI_MONTHLY_CONSUMPTION_MAP=gui_cbp_${good}_ui_monthly_consumption_by_market"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected generator token: {old}')
              text = text.replace(old, new)
          generator.write_text(text, encoding='utf-8')

          exact_runtime_renames = {
              'modeu5_generated_stock_good_count': 'cbp_generated_stock_good_count',
              'modeu5_pr71_active_good_metrics_stamp': 'cbp_pr71_active_good_metrics_stamp',
              'modeu5_pr71_us00_goods_considered': 'cbp_pr71_us00_goods_considered',
              'modeu5_pr71_us00_goods_previous_state_hits': 'cbp_pr71_us00_goods_previous_state_hits',
              'modeu5_pr71_us00_goods_processed': 'cbp_pr71_us00_goods_processed',
              'modeu5_pr71_us00_goods_produced_gate_hits': 'cbp_pr71_us00_goods_produced_gate_hits',
              'modeu5_pr71_us10_goods_considered': 'cbp_pr71_us10_goods_considered',
              'modeu5_pr71_us10_pending_request_hits': 'cbp_pr71_us10_pending_request_hits',
              'modeu5_pr71_us10_requests_processed': 'cbp_pr71_us10_requests_processed',
              'modeu5_reconciliation_type': 'cbp_reconciliation_type',
              'modeu5_us10_total_transferred_quantity': 'cbp_us10_total_transferred_quantity',
              'test_cbp_active_markets_any_good': 'cbp_active_markets_any_good',
              'test_cbp_market_owned_active_markets_processed_count': 'cbp_market_owned_active_markets_processed_count',
              'test_cbp_market_owned_country_cache_rebuild_count': 'cbp_market_owned_country_cache_rebuild_count',
              'test_cbp_trade_owner_goods_quantity': 'cbp_trade_owner_goods_quantity',
              'test_cbp_trade_owner_quantity_matched': 'cbp_trade_owner_quantity_matched',
          }

          suffixes = {'.txt', '.gui', '.sh', '.py', '.md', '.yml', '.yaml'}
          excluded_parts = {'.git', '.github'}
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in suffixes:
                  continue
              if any(part in excluded_parts for part in path.parts):
                  continue
              original = path.read_text(encoding='utf-8-sig', errors='ignore')
              updated = original
              for old, new in exact_runtime_renames.items():
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Regenerate outputs
        run: ./tools/generate_all.sh

      - name: Validate and capture diagnostics
        id: validate
        shell: bash
        run: |
          set +e
          mkdir -p generated-stock-prefix-logs
          {
            python3 tools/cbp_variable_prefixes.py --check
            ./tools/validate_generators.sh
            ./tools/validate_module_packages.sh
            ./tools/audit_modeu5_persistent_state.sh
            python3 ./tools/validate_ci_static_contracts.py
            git diff --check
          } > generated-stock-prefix-logs/validation.log 2>&1
          status=$?
          cat generated-stock-prefix-logs/validation.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-stock-prefix-diagnostics
          path: generated-stock-prefix-logs/

      - name: Commit generator corrections
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset generated-stock-prefix-logs/ || true
          git commit -m 'Correct generated stock variable prefixes'
          git push origin HEAD:refactor/cbp-variable-prefixes

      - name: Fail remaining validation error
        if: steps.validate.outputs.status != '0'
        run: exit 1
