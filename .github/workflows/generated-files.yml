name: Generated Files

on:
  push:
  pull_request:

jobs:
  validate-generated-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate local artifacts
        run: |
          set +e
          ./tools/generate_all.sh > generate_all.log 2>&1
          status=$?
          cat generate_all.log
          exit $status

      - name: Upload generator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generate-all-log
          path: generate_all.log

      - name: Validate US-09 generator with fixture common dir
        run: |
          set -euo pipefail

          fixture_common="$RUNNER_TEMP/us09_common"
          fixture_package="$RUNNER_TEMP/us09_package/in_game/common"

          mkdir -p \
            "$fixture_common/building_types" \
            "$fixture_common/prices" \
            "$fixture_common/pop_types"
          mkdir -p \
            "$fixture_package/building_types" \
            "$fixture_package/prices" \
            "$fixture_package/pop_types"

          cat > "$fixture_common/building_types/00_test_production.txt" <<'EOF'
          test_production = {
              unique_production_methods = {
                  test_production_maintenance = {
                      wheat = 4
                      copper = 2
                      category = building_maintenance
                  }
              }
              output = 10
              modifier = {
                  local_burghers_estate_power = 0.1
                  local_trades_per_burgher = 1
                  local_merchant_capacity = 2
                  merchant_capacity_from_building = 3
              }
          }
          EOF

          cat > "$fixture_common/prices/00_hardcoded.txt" <<'EOF'
          expand_rgo_mining = { gold = 100 }
          expand_rgo_farming = { gold = 100 }
          expand_rgo_hunting = { gold = 100 }
          expand_rgo_gathering = { gold = 100 }
          expand_rgo_forestry = { gold = 100 }
          EOF

          cat > "$fixture_common/pop_types/00_pop_types.txt" <<'EOF'
          burghers = {
              promotion_speed = 0.5
              migration_speed = 0.5
          }

          laborers = {
              promotion_speed = 1.5
              migration_speed = 0.1
          }

          peasants = {
              promotion_speed = 0.5
          }
          EOF

          ./tools/generate_us09_economy_overrides.sh \
            --percent 10 \
            --trade-capacity-percent 15 \
            --extra-burgher-promotion-speed 10 \
            --extra-laborer-promotion-speed 10 \
            --building-maintenance-multiplier 0.7 \
            --trade-building-maintenance-multiplier 0.5 \
            --common-dir "$fixture_common" \
            --package-common-dir "$fixture_package"

          test -f "$fixture_package/building_types/00_test_production.txt"
          test -f "$fixture_package/prices/00_hardcoded.txt"
          test -f "$fixture_package/pop_types/00_pop_types.txt"
          test ! -f "$fixture_package/building_types/zzzz_cbp_us09_00_test_production.txt"
          test ! -f "$fixture_package/prices/zzzz_cbp_us09_expand_rgo_prices.txt"
          test ! -f "$fixture_package/prices/expand_rgo_prices.txt"
          grep -q 'output = 11.0' "$fixture_package/building_types/00_test_production.txt"
          grep -q 'wheat = 2.8' "$fixture_package/building_types/00_test_production.txt"
          grep -q 'copper = 1.4' "$fixture_package/building_types/00_test_production.txt"
          grep -q 'local_trades_per_burgher = 1' "$fixture_package/building_types/00_test_production.txt"
          grep -q 'local_merchant_capacity = 2.3' "$fixture_package/building_types/00_test_production.txt"
          grep -q 'merchant_capacity_from_building = 3.45' "$fixture_package/building_types/00_test_production.txt"
          grep -q 'local_burghers_estate_power = 0.1' "$fixture_package/building_types/00_test_production.txt"
          grep -q 'promotion_speed = 0.55' "$fixture_package/pop_types/00_pop_types.txt"
          grep -q 'promotion_speed = 1.65' "$fixture_package/pop_types/00_pop_types.txt"
          grep -q 'peasants' "$fixture_package/pop_types/00_pop_types.txt"

          cat > "$fixture_common/building_types/trade_buildings.txt" <<'EOF'
          marketplace = {
              category = trade_category
              unique_production_methods = {
                  marketplace_maintenance = {
                      cloth = 0.06
                      paper = 0.05
                      category = building_maintenance
                  }
              }
              modifier = {
                  local_burghers_estate_power = 0.1
                  local_trades_per_burgher = 1
                  local_merchant_capacity = 1
                  local_merchant_power = 1
              }
          }

          merchants_quarters = {
              category = trade_category
              unique_production_methods = {
                  merchants_quarters_maintenance = {
                      cloth = 0.30
                      paper = 0.25
                      beeswax = 0.20
                      category = building_maintenance
                  }
              }
              modifier = {
                  local_burghers_estate_power = 0.1
                  local_trades_per_burgher = 1.5
                  local_merchant_capacity = 1.5
                  local_merchant_power = 1.5
              }
          }

          grand_marketplace = {
              category = trade_category
              unique_production_methods = {
                  grand_marketplace_maintenance = {
                      cloth = 0.60
                      paper = 0.50
                      beeswax = 0.40
                      category = building_maintenance
                  }
              }
              modifier = {
                  local_burghers_estate_power = 0.1
                  local_trades_per_burgher = 2
                  local_merchant_capacity = 2
                  local_merchant_power = 2
              }
          }
          EOF

          cat > "$fixture_common/building_types/market_buildings.txt" <<'EOF'
          market_warehouse = {
              is_foreign = no
              pop_type = burghers
              max_levels = market_warehouse_max_level
              category = trade_category
              location_potential = {
                  is_market_center = yes
              }
              modifier = {
                  local_merchant_capacity = 0.1
                  local_trades_per_burgher = 0.1
              }
              market_center_modifier = {
                  maximum_stockpile_capacity = 200
              }
          }
          EOF

          ./tools/generate_us09_economy_overrides.sh \
            --percent 10 \
            --trade-capacity-percent 15 \
            --extra-burgher-promotion-speed 10 \
            --extra-laborer-promotion-speed 10 \
            --building-maintenance-multiplier 0.7 \
            --trade-building-maintenance-multiplier 0.5 \
            --common-dir "$fixture_common" \
            --package-common-dir "$fixture_package"

          grep -q 'local_burghers_estate_power = 0.05' "$fixture_package/building_types/trade_buildings.txt"
          grep -q 'cloth = 0.03' "$fixture_package/building_types/trade_buildings.txt"
          grep -q 'paper = 0.025' "$fixture_package/building_types/trade_buildings.txt"
          test "$(grep -c 'cloth = 0.03' "$fixture_package/building_types/trade_buildings.txt")" -eq 3
          test "$(grep -c 'paper = 0.025' "$fixture_package/building_types/trade_buildings.txt")" -eq 3
          test "$(grep -c 'beeswax' "$fixture_package/building_types/trade_buildings.txt")" -eq 0
          grep -q 'local_trades_per_burgher = 1' "$fixture_package/building_types/trade_buildings.txt"
          grep -q 'local_merchant_capacity = 1.15' "$fixture_package/building_types/trade_buildings.txt"
          grep -q 'local_merchant_power = 1' "$fixture_package/building_types/trade_buildings.txt"
          grep -q 'market_warehouse = {' "$fixture_package/building_types/market_buildings.txt"
          grep -q 'country_potential = {' "$fixture_package/building_types/market_buildings.txt"
          grep -q 'location_potential = {' "$fixture_package/building_types/market_buildings.txt"
          test "$(grep -c 'always = no' "$fixture_package/building_types/market_buildings.txt")" -eq 2
          grep -q 'local_merchant_capacity = 0.115' "$fixture_package/building_types/market_buildings.txt"
          grep -q 'local_trades_per_burgher = 0.1' "$fixture_package/building_types/market_buildings.txt"
          grep -q 'expand_rgo_mining' "$fixture_package/prices/00_hardcoded.txt"
          grep -q 'promotion_speed = 0.55' "$fixture_package/pop_types/00_pop_types.txt"
          grep -q 'promotion_speed = 1.65' "$fixture_package/pop_types/00_pop_types.txt"

      - name: Validate complete vanilla defines generator
        run: |
          set -euo pipefail

          fixture_defines="$RUNNER_TEMP/eu5_game/loading_screen/common/defines/00_defines.txt"
          generated_defines="$RUNNER_TEMP/modeu5/loading_screen/common/defines/00_defines.txt"
          mkdir -p "$(dirname "$fixture_defines")" "$(dirname "$generated_defines")"

          cat > "$fixture_defines" <<'EOF'
          NGraphics = {
              DX12_DEVICE_RECOVERY = yes
              ANTI_ALIASING_QUALITY = 4
          }

          NEconomy = {
              PRODUCTION_EFFIENCY_BONUS_PER_LEVEL = 0.01 # vanilla
              PRICE_SCALE_FROM_ECO_BASE = 0.1
              GOODS_RGO_BASE_COST = 0.5
              GOODS_RGO_PRICE_SCALE = 0.25
          }

          NUnrelated = {
              KEEP_ME = 42
          }
          EOF

          bash ./tools/generate_cbp_defines_override.sh \
            --source-file "$fixture_defines" \
            --output-file "$generated_defines" \
            --production-efficiency-bonus-per-level 0.015 \
            --price-scale-from-eco-base 0 \
            --goods-rgo-base-cost 1 \
            --goods-rgo-price-scale 0

          grep -q '^# Generated by tools/generate_cbp_defines_override.sh.$' "$generated_defines"
          grep -q 'DX12_DEVICE_RECOVERY = yes' "$generated_defines"
          grep -q 'ANTI_ALIASING_QUALITY = 4' "$generated_defines"
          grep -q 'KEEP_ME = 42' "$generated_defines"
          grep -q 'PRODUCTION_EFFIENCY_BONUS_PER_LEVEL = 0.015 # vanilla' "$generated_defines"
          grep -q 'PRICE_SCALE_FROM_ECO_BASE = 0$' "$generated_defines"
          grep -q 'GOODS_RGO_BASE_COST = 1$' "$generated_defines"
          grep -q 'GOODS_RGO_PRICE_SCALE = 0$' "$generated_defines"
          test "$(grep -c 'DX12_DEVICE_RECOVERY = yes' "$generated_defines")" -eq 1
          test "$(grep -c 'PRODUCTION_EFFIENCY_BONUS_PER_LEVEL' "$generated_defines")" -eq 2
          test "$(LC_ALL=C head -c 3 "$generated_defines" | od -An -tx1 | tr -d ' \n')" != 'efbbbf'

          bash ./tools/generate_cbp_defines_override.sh \
            --source-file "$fixture_defines" \
            --output-file "$generated_defines" \
            --production-efficiency-bonus-per-level 0.015 \
            --price-scale-from-eco-base 0 \
            --goods-rgo-base-cost 1 \
            --goods-rgo-price-scale 0 \
            --check

          printf '\nPRODUCTION_EFFIENCY_BONUS_PER_LEVEL = 0.02\n' >> "$fixture_defines"
          if bash ./tools/generate_cbp_defines_override.sh \
            --source-file "$fixture_defines" \
            --output-file "$generated_defines" >/dev/null 2>&1
          then
            echo 'Defines generator must reject duplicate target keys.' >&2
            exit 1
          fi

      - name: Validate package structure and generated adapters
        run: |
          set +e
          /bin/bash ./tools/validate_module_packages.sh > validate_module_packages.log 2>&1
          status=$?
          cat validate_module_packages.log
          exit $status

      - name: Upload package validator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-module-packages-log
          path: validate_module_packages.log

      - name: Audit persistent state surface
        run: /bin/bash ./tools/audit_cbp_persistent_state.sh

      - name: Validate CMM value-link quoting
        run: /bin/bash ./tools/normalize_cmm_value_links.sh --check

      - name: Validate generator conventions
        run: /bin/bash ./tools/validate_generators.sh

      - name: Validate ModeU5 script safety
        run: /bin/bash ./tools/validate_cbp_script_safety.sh

      - name: Validate CMM configuration
        run: python3 ./tools/validate_cmm_configuration.py

      - name: Validate CI static contracts
        run: |
          set +e
          python3 ./tools/validate_ci_static_contracts.py > validate_ci_static_contracts.log 2>&1
          status=$?
          cat validate_ci_static_contracts.log
          exit $status

      - name: Upload CI static contract validator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-ci-static-contracts-log
          path: validate_ci_static_contracts.log

      - name: Validate whitespace and patch hygiene
        run: git diff --check

      - name: Ensure generated outputs stay untracked
        run: |
          tracked_generated="$(git ls-files | grep -E '(^|/)cbp_[^/]*_generated\.txt$|^loading_screen/common/defines/00_defines\.txt$' || true)"
          if [ -n "$tracked_generated" ]; then
            echo "Generated ModeU5 outputs must not be tracked:"
            echo "$tracked_generated"
            exit 1
          fi

      - name: Ensure generation does not dirty tracked files
        run: |
          changed="$(git status --short --untracked-files=no)"
          if [ -n "$changed" ]; then
            echo "Tracked files changed after generation:"
            echo "$changed"
            exit 1
          fi
