name: Generated Files

on:
  push:
  pull_request:

jobs:
  validate-generated-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate local artifacts
        run: |
          set +e
          ./tools/generate_all.sh > generate_all.log 2>&1
          status=$?
          cat generate_all.log
          exit $status

      - name: Upload generator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generate-all-log
          path: generate_all.log

      - name: Validate US-09 generator with fixture common dir
        run: |
          set -euo pipefail

          fixture_common="$RUNNER_TEMP/us09_common"
          fixture_package="$RUNNER_TEMP/us09_package/in_game/common"

          mkdir -p "$fixture_common/building_types" "$fixture_common/prices"
          mkdir -p "$fixture_package/building_types" "$fixture_package/prices"

          cat > "$fixture_common/building_types/00_test_production.txt" <<'EOF'
          test_production = {
              output = 10
          }
          EOF

          cat > "$fixture_common/prices/00_hardcoded.txt" <<'EOF'
          expand_rgo_mining = { gold = 100 }
          expand_rgo_farming = { gold = 100 }
          expand_rgo_hunting = { gold = 100 }
          expand_rgo_gathering = { gold = 100 }
          expand_rgo_forestry = { gold = 100 }
          EOF

          ./tools/generate_us09_economy_overrides.sh \
            --percent 10 \
            --common-dir "$fixture_common" \
            --package-common-dir "$fixture_package"

          test -f "$fixture_package/building_types/zzzz_modeu5_us09_00_test_production.txt"
          test -f "$fixture_package/prices/zzzz_modeu5_us09_expand_rgo_prices.txt"
          grep -q 'output = 11.0' "$fixture_package/building_types/zzzz_modeu5_us09_00_test_production.txt"
          grep -q 'expand_rgo_mining' "$fixture_package/prices/zzzz_modeu5_us09_expand_rgo_prices.txt"

      - name: Validate package structure and generated adapters
        run: |
          set +e
          /bin/bash ./tools/validate_module_packages.sh > validate_module_packages.log 2>&1
          status=$?
          cat validate_module_packages.log
          exit $status

      - name: Upload package validator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-module-packages-log
          path: validate_module_packages.log

      - name: Audit persistent state surface
        run: /bin/bash ./tools/audit_modeu5_persistent_state.sh

      - name: Validate CMM value-link quoting
        run: /bin/bash ./tools/normalize_cmm_value_links.sh --check

      - name: Validate generator conventions
        run: /bin/bash ./tools/validate_generators.sh

      - name: Validate ModeU5 script safety
        run: /bin/bash ./tools/validate_modeu5_script_safety.sh

      - name: Validate CMM configuration
        run: python3 ./tools/validate_cmm_configuration.py

      - name: Validate CI static contracts
        run: |
          set +e
          python3 ./tools/validate_ci_static_contracts.py > validate_ci_static_contracts.log 2>&1
          status=$?
          cat validate_ci_static_contracts.log
          exit $status

      - name: Upload CI static contract validator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-ci-static-contracts-log
          path: validate_ci_static_contracts.log

      - name: Validate whitespace and patch hygiene
        run: git diff --check

      - name: Ensure generated outputs stay untracked
        run: |
          tracked_generated="$({ git ls-files | grep -E '(^|/)modeu5_[^/]*_generated\.txt$'; git ls-files | grep -E '^packages/modeu5_economy_rebalance/in_game/common/(building_types/.*\.txt|prices/00_default\.txt)$'; } || true)"
          if [ -n "$tracked_generated" ]; then
            echo "Generated ModeU5 outputs must not be tracked:"
            echo "$tracked_generated"
            exit 1
          fi

      - name: Ensure generation does not dirty tracked files
        run: |
          changed="$(git status --short --untracked-files=no)"
          if [ -n "$changed" ]; then
            echo "Tracked files changed after generation:"
            echo "$changed"
            exit 1
          fi
