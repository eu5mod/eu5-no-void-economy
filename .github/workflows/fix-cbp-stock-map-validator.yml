name: Fix CBP stock-map validator

on:
  pull_request:
    branches:
      - us-17-trade-reconciliation
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: fix-cbp-stock-map-validator
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'refactor/cbp-variable-prefixes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stacked branch
        uses: actions/checkout@v4
        with:
          ref: refactor/cbp-variable-prefixes
          fetch-depth: 0

      - name: Correct runtime stock-map assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/validate_module_packages.sh')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'variable_map\\(test_cbp_wheat_stock_by_market\\|scope:modeu5_market\\)',
              'variable_map\\(cbp_wheat_stock_by_market\\|scope:modeu5_market\\)',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate and validate
        run: |
          ./tools/generate_all.sh
          python3 tools/cbp_variable_prefixes.py --check
          ./tools/validate_generators.sh
          ./tools/validate_module_packages.sh
          ./tools/audit_modeu5_persistent_state.sh
          python3 ./tools/validate_ci_static_contracts.py
          git diff --check

      - name: Commit validator correction
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/validate_module_packages.sh
          git commit -m 'Correct CBP stock-map validator token'
          git push origin HEAD:refactor/cbp-variable-prefixes
