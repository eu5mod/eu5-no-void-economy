name: Apply CBP variable prefixes

on:
  pull_request:
    branches:
      - us-17-trade-reconciliation
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: cbp-variable-prefix-migration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'refactor/cbp-variable-prefixes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stacked branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/cbp-variable-prefixes

      - name: Apply variable migration
        id: migrate
        shell: bash
        run: |
          set +e
          mkdir -p cbp-migration-logs
          python3 tools/cbp_variable_prefixes.py --apply \
            > cbp-migration-logs/apply.log 2>&1
          status=$?
          cat cbp-migration-logs/apply.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate prefix contract
        if: steps.migrate.outputs.status == '0'
        run: python3 tools/cbp_variable_prefixes.py --check

      - name: Generate repository outputs
        if: steps.migrate.outputs.status == '0'
        id: generate
        shell: bash
        run: |
          set +e
          ./tools/generate_all.sh > cbp-migration-logs/generate.log 2>&1
          status=$?
          cat cbp-migration-logs/generate.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run static validators
        if: steps.migrate.outputs.status == '0' && steps.generate.outputs.status == '0'
        id: validate
        shell: bash
        run: |
          set +e
          {
            ./tools/validate_generators.sh
            ./tools/validate_module_packages.sh
            ./tools/audit_modeu5_persistent_state.sh
            python3 ./tools/validate_ci_static_contracts.py
            git diff --check
          } > cbp-migration-logs/static-validation.log 2>&1
          status=$?
          cat cbp-migration-logs/static-validation.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbp-variable-migration-logs
          path: cbp-migration-logs/

      - name: Fail unsuccessful migration
        if: steps.migrate.outputs.status != '0' || steps.generate.outputs.status != '0' || steps.validate.outputs.status != '0'
        run: exit 1

      - name: Commit migrated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset cbp-migration-logs/ || true
          git commit -m "Refactor variables to CBP prefix contract"
          git push origin HEAD:refactor/cbp-variable-prefixes
