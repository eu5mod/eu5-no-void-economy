name: US-177 TECH-01 Finalize

on:
  push:
    branches:
      - agent/us177-double-food-minting

permissions:
  contents: write

jobs:
  update-tech01:
    if: ${{ !contains(github.event.head_commit.message, '[us177-tech01]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/us177-double-food-minting
          fetch-depth: 0

      - name: Insert confirmed US-177 engine exposure rows
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/technical/TECH-01_engine_exposure_matrix.md')
          text = path.read_text(encoding='utf-8')
          if '| 153 | US-177 |' not in text:
              rows = '''| 153 | US-177 | Set the shared food valuation input to exactly twice vanilla | loading-screen define database | `NMarket.FOOD_PRICE = 0.1` against supported vanilla `0.05` | static define | Local vanilla `loading_screen/common/defines/00_defines.txt`; issue #177 | CONFIRMED | Package-owned static override | The Rebalance Economy package changes only `FOOD_PRICE`; non-food market defines remain untouched. Local source comparison must fail when the supported vanilla value changes. |
| 154 | US-177 | Identify the definitive set of goods treated as food | goods database object | numeric `food` field in `in_game/common/goods`; food good iff `food > 0` | static field / generated manifest | Local vanilla `goods/readme.txt`; supported vanilla goods files; `us177_food_goods_manifest.json` | CONFIRMED | Generate the list from vanilla rather than hard-code it | The supported reference contains 14 food goods. The manifest records every source file, line, value, and source fingerprint and must be regenerated after an EU5 patch. |
| 155 | US-177 | Double total gross minting income despite additive bonuses | country modifier stack plus exact-path static sources | universal `minting_income_factor = 1.0` plus every vanilla numeric `minting_income_factor` source multiplied by `2` | additive modifier / generated exact-path overrides | Modifier docs; supported vanilla source audit; US-177 manifests and CI fixture | FALLBACK_ACCEPTED | Exact algebraic composition: `1 + 1 + 2S = 2(1 + S)` | No multiplicative total-minting endpoint or base define was confirmed. The accepted fallback scales positive and negative vanilla sources, fails on dynamic expressions, composes building files with US-07/US-09, and does not alter inflation fields. |
'''
              marker = '\n\n\n## Unresolved exposure impact matrix'
              if marker not in text:
                  raise SystemExit('TECH-01 insertion marker not found')
              text = text.replace(marker, '\n' + rows + '\n\n## Unresolved exposure impact matrix', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit TECH-01 rows and remove this workflow
        run: |
          set -euo pipefail
          rm .github/workflows/us177-tech01-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/technical/TECH-01_engine_exposure_matrix.md
          git add -u .github/workflows/us177-tech01-finalize.yml
          git commit -m 'US-177: record engine exposure findings [us177-tech01]'
          git push origin HEAD:agent/us177-double-food-minting
