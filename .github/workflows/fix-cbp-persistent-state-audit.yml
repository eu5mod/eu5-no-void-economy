name: Fix CBP persistent-state audit

on:
  pull_request:
    branches:
      - us-17-trade-reconciliation
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: fix-cbp-persistent-state-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'refactor/cbp-variable-prefixes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stacked branch
        uses: actions/checkout@v4
        with:
          ref: refactor/cbp-variable-prefixes
          fetch-depth: 0

      - name: Run final fail-fast validation
        id: validate
        shell: bash
        run: |
          set +e
          mkdir -p cbp-persistent-audit-logs
          status=0
          for command in \
            './tools/generate_all.sh' \
            'python3 tools/cbp_variable_prefixes.py --check' \
            './tools/validate_generators.sh' \
            './tools/validate_module_packages.sh' \
            './tools/audit_modeu5_persistent_state.sh' \
            'python3 ./tools/validate_ci_static_contracts.py' \
            'git diff --check'
          do
            {
              echo "### $command"
              bash -lc "$command"
            } >> cbp-persistent-audit-logs/validation.log 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "first_failed_command=$command" >> cbp-persistent-audit-logs/validation.log
              break
            fi
          done
          cat cbp-persistent-audit-logs/validation.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbp-persistent-audit-diagnostics
          path: cbp-persistent-audit-logs/

      - name: Fail invalid branch
        if: steps.validate.outputs.status != '0'
        run: exit 1
