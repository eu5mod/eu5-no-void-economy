name: Fix CBP persistent-state audit

on:
  pull_request:
    branches:
      - us-17-trade-reconciliation
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: fix-cbp-persistent-state-audit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'refactor/cbp-variable-prefixes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stacked branch
        uses: actions/checkout@v4
        with:
          ref: refactor/cbp-variable-prefixes
          fetch-depth: 0

      - name: Update executable and documented persistent-state inventories
        run: |
          python3 - <<'PY'
          from pathlib import Path

          audit_path = Path('tools/audit_modeu5_persistent_state.sh')
          audit = audit_path.read_text(encoding='utf-8')

          exact_replacements = {
              're.compile(r"\\bmodeu5_\\$\\{good\\}_[A-Za-z0-9_]+(?:_by_market|_markets|_suppliers|_market_stock)\\b"),':
                  're.compile(r"\\b(?:cbp|gui_cbp)_\\$\\{good\\}_[A-Za-z0-9_]+(?:_by_market|_markets|_suppliers|_market_stock)\\b"),',
              're.compile(r"\\bmodeu5_(?:consumption|trade)___GOOD___[A-Za-z0-9_]+_by_market\\b"),':
                  're.compile(r"\\bcbp_(?:consumption|trade)___GOOD___[A-Za-z0-9_]+_by_market\\b"),',
              '        normalized = re.sub(rf"\\bmodeu5_{re.escape(good)}_", "modeu5_<good>_", normalized)\n'
              '        normalized = re.sub(rf"\\bmodeu5_consumption_{re.escape(good)}_", "modeu5_consumption_<good>_", normalized)\n'
              '        normalized = re.sub(rf"\\bmodeu5_trade_{re.escape(good)}_", "modeu5_trade_<good>_", normalized)':
                  '        normalized = re.sub(rf"\\bcbp_{re.escape(good)}_", "cbp_<good>_", normalized)\n'
                  '        normalized = re.sub(rf"\\bgui_cbp_{re.escape(good)}_", "gui_cbp_<good>_", normalized)\n'
                  '        normalized = re.sub(rf"\\bcbp_consumption_{re.escape(good)}_", "cbp_consumption_<good>_", normalized)\n'
                  '        normalized = re.sub(rf"\\bcbp_trade_{re.escape(good)}_", "cbp_trade_<good>_", normalized)',
              '        "modeu5_<good>_active_markets",': '        "cbp_<good>_active_markets",',
              '        "modeu5_<good>_dirty_markets",': '        "cbp_<good>_dirty_markets",',
              '        "modeu5_<good>_us10_sparse_suppliers",': '        "cbp_<good>_us10_sparse_suppliers",',
              '    return name in known_lists or name in known_good_lists or name == "modeu5_<good>_market_stock"':
                  '    return name in known_lists or name in known_good_lists or name == "cbp_<good>_market_stock"',
          }
          for old, new in exact_replacements.items():
              if old not in audit:
                  raise SystemExit(f'missing expected audit source fragment: {old}')
              audit = audit.replace(old, new)

          inventory_start = audit.index('cat > "$tmp_inventory" <<\'EOF\'')
          inventory_end = audit.index('\nEOF', inventory_start)
          inventory = audit[inventory_start:inventory_end]

          inventory_replacements = {
              'modeu5_<good>_ui_monthly_consumption_by_market': 'gui_cbp_<good>_ui_monthly_consumption_by_market',
              'modeu5_<good>_ui_monthly_surplus_by_market': 'gui_cbp_<good>_ui_monthly_surplus_by_market',
              'modeu5_consumption_<good>_': 'cbp_consumption_<good>_',
              'modeu5_trade_<good>_': 'cbp_trade_<good>_',
              'modeu5_<good>_': 'cbp_<good>_',
              'modeu5_active_markets_any_good': 'cbp_active_markets_any_good',
              'modeu5_stock_cap_by_market': 'cbp_stock_cap_by_market',
              'modeu5_base_capacity_by_market': 'cbp_base_capacity_by_market',
              'modeu5_building_capacity_by_market': 'cbp_building_capacity_by_market',
              'modeu5_foreign_capacity_by_market': 'cbp_foreign_capacity_by_market',
              'modeu5_countries_present_in_market': 'cbp_countries_present_in_market',
              'modeu5_market_country_cache_dirty_markets': 'cbp_market_country_cache_dirty_markets',
              'modeu5_market_sliced_verifier_candidate_markets': 'cbp_market_sliced_verifier_candidate_markets',
              'modeu5_monthly_markets_seen_this_cycle': 'cbp_monthly_markets_seen_this_cycle',
              'modeu5_performance_relevant_markets': 'cbp_performance_relevant_markets',
              'modeu5_promoted_markets_this_cycle': 'cbp_promoted_markets_this_cycle',
              'modeu5_detailed_accounting_promoted_markets': 'cbp_detailed_accounting_promoted_markets',
              'modeu5_core03_probe_seen_locations': 'cbp_core03_probe_seen_locations',
              'modeu5_void_wealth_by_market': 'cbp_void_wealth_by_market',
          }
          for old, new in inventory_replacements.items():
              inventory = inventory.replace(old, new)
          audit = audit[:inventory_start] + inventory + audit[inventory_end:]
          audit_path.write_text(audit, encoding='utf-8')

          doc_path = Path('docs/technical/PERSISTENT_STATE_AUDIT.md')
          doc = doc_path.read_text(encoding='utf-8')
          doc_replacements = {
              '`modeu5_<good>_ui_monthly_consumption_by_market`': '`gui_cbp_<good>_ui_monthly_consumption_by_market`',
              '`modeu5_<good>_ui_monthly_surplus_by_market`': '`gui_cbp_<good>_ui_monthly_surplus_by_market`',
              '`modeu5_consumption_<good>_': '`cbp_consumption_<good>_',
              '`modeu5_trade_<good>_': '`cbp_trade_<good>_',
              '`modeu5_<good>_': '`cbp_<good>_',
              '`modeu5_stock_cap_by_market`': '`cbp_stock_cap_by_market`',
              '`modeu5_base_capacity_by_market`': '`cbp_base_capacity_by_market`',
              '`modeu5_building_capacity_by_market`': '`cbp_building_capacity_by_market`',
              '`modeu5_foreign_capacity_by_market`': '`cbp_foreign_capacity_by_market`',
              '`modeu5_active_markets_any_good`': '`cbp_active_markets_any_good`',
              '`modeu5_countries_present_in_market`': '`cbp_countries_present_in_market`',
              '`modeu5_market_country_cache_dirty_markets`': '`cbp_market_country_cache_dirty_markets`',
              '`modeu5_market_sliced_verifier_candidate_markets`': '`cbp_market_sliced_verifier_candidate_markets`',
              '`modeu5_monthly_markets_seen_this_cycle`': '`cbp_monthly_markets_seen_this_cycle`',
              '`modeu5_performance_relevant_markets`': '`cbp_performance_relevant_markets`',
              '`modeu5_promoted_markets_this_cycle`': '`cbp_promoted_markets_this_cycle`',
              '`modeu5_detailed_accounting_promoted_markets`': '`cbp_detailed_accounting_promoted_markets`',
              '`modeu5_core03_probe_seen_locations`': '`cbp_core03_probe_seen_locations`',
              '`modeu5_void_wealth_by_market`': '`cbp_void_wealth_by_market`',
          }
          for old, new in doc_replacements.items():
              doc = doc.replace(old, new)
          doc_path.write_text(doc, encoding='utf-8')
          PY

      - name: Commit persistent-state inventory correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/audit_modeu5_persistent_state.sh docs/technical/PERSISTENT_STATE_AUDIT.md
          git commit -m 'Update persistent-state inventory for CBP prefixes'
          git push origin HEAD:refactor/cbp-variable-prefixes

      - name: Regenerate and validate with fail-fast semantics
        run: |
          set -euo pipefail
          ./tools/generate_all.sh
          python3 tools/cbp_variable_prefixes.py --check
          ./tools/validate_generators.sh
          ./tools/validate_module_packages.sh
          ./tools/audit_modeu5_persistent_state.sh
          python3 ./tools/validate_ci_static_contracts.py
          git diff --check
