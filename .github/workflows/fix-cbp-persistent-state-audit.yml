name: Fix CBP persistent-state audit

on:
  pull_request:
    branches:
      - us-17-trade-reconciliation
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: fix-cbp-persistent-state-audit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'refactor/cbp-variable-prefixes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stacked branch
        uses: actions/checkout@v4
        with:
          ref: refactor/cbp-variable-prefixes
          fetch-depth: 0

      - name: Correct US17 average-variable assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/validate_ci_static_contracts.py')
          text = path.read_text(encoding='utf-8')
          old = 'r"name\\s*=\\s*modeu5_buying_selling_efficiency_clamped(?P<body>.*?)(?:\\n\\s*\\}|\\n\\s*save_temporary_scope_value_as)"'
          new = 'r"name\\s*=\\s*gui_cbp_buying_selling_efficiency_clamped(?P<body>.*?)(?:\\n\\s*\\}|\\n\\s*save_temporary_scope_value_as)"'
          if old not in text:
              raise SystemExit('missing legacy US17 average assertion')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit validator correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/validate_ci_static_contracts.py
          git commit -m 'Correct US17 GUI variable validator token'
          git push origin HEAD:refactor/cbp-variable-prefixes

      - name: Regenerate and validate with fail-fast semantics
        run: |
          set -euo pipefail
          ./tools/generate_all.sh
          python3 tools/cbp_variable_prefixes.py --check
          ./tools/validate_generators.sh
          ./tools/validate_module_packages.sh
          ./tools/audit_modeu5_persistent_state.sh
          python3 ./tools/validate_ci_static_contracts.py
          git diff --check
