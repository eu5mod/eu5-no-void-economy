name: Apply US04 Sparse Fixup PR

on:
  pull_request:

permissions:
  contents: write

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: perf/sparse-us04-work-indexes
          fetch-depth: 0

      - name: Apply source fixup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          def patch_generator(path: str) -> None:
              target = Path(path)
              lines = target.read_text(encoding='utf-8').splitlines()
              membership_done = False
              processing_done = False
              for i, line in enumerate(lines):
                  if line.strip() == '"\\t\\t\\t\\t\\tOR = {",' and i + 3 < len(lines):
                      nxt = [lines[i + j].strip() for j in range(1, 4)]
                      if ('cbp_us04_sparse_coefficient_active > 0' in nxt[0]
                              and 'cbp_us04_sparse_proxy_present > 0' in nxt[1]
                              and 'cbp_us04_sparse_prior_record_present > 0' in nxt[2]):
                          prefix = line[:len(line) - len(line.lstrip())]
                          lines[i + 1:i + 3] = [
                              prefix + '"\\t\\t\\t\\t\\t\\tAND = {",',
                              prefix + '"\\t\\t\\t\\t\\t\\t\\tscope:cbp_us04_sparse_coefficient_active > 0",',
                              prefix + '"\\t\\t\\t\\t\\t\\t\\tscope:cbp_us04_sparse_proxy_present > 0",',
                              prefix + '"\\t\\t\\t\\t\\t\\t}",',
                          ]
                          membership_done = True
                          break
              for i, line in enumerate(lines):
                  if line.strip() == '"\\t\\t\\t\\t\\t\\tOR = {",' and i + 2 < len(lines):
                      if ('cbp_us04_sparse_coefficient_active > 0' in lines[i + 1]
                              and 'cbp_us04_sparse_proxy_present > 0' in lines[i + 2]):
                          lines[i] = line.replace('OR = {', 'AND = {')
                          processing_done = True
                          break
              if not membership_done and not any('\\t\\t\\t\\t\\t\\tAND = {' in line for line in lines):
                  raise SystemExit(f'{path}: sparse membership predicate not found')
              if not processing_done and not any(line.strip() == '"\\t\\t\\t\\t\\t\\tAND = {",' for line in lines):
                  raise SystemExit(f'{path}: sparse processing predicate not found')
              target.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          def block_range(text: str, name: str) -> tuple[int, int]:
              marker = f'{name} = {{'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'Missing block {name}')
              open_brace = text.find('{', start)
              depth = 0
              in_quote = False
              escaped = False
              for i in range(open_brace, len(text)):
                  ch = text[i]
                  if in_quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == '"':
                          in_quote = False
                      continue
                  if ch == '"':
                      in_quote = True
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
              raise SystemExit(f'Unclosed block {name}')

          def patch_resolver(path: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              refresh = 'cbp_us04_refresh_location_sparse_index_good_$good$ = yes'
              for name in [
                  'cbp_reset_us04_location_estate_proxy',
                  'cbp_record_us04_location_estate_proxy_peasants_estate',
                  'cbp_record_us04_location_estate_proxy_burghers_estate',
                  'cbp_record_us04_location_estate_proxy_nobles_estate',
                  'cbp_record_us04_location_estate_proxy_clergy_estate',
                  'cbp_reset_pop_demand_outcome',
              ]:
                  start, end = block_range(text, name)
                  block = text[start:end]
                  if refresh in block:
                      continue
                  close = block.rfind('\n\t}')
                  if close < 0:
                      raise SystemExit(f'Could not find location-scope close in {name}')
                  block = block[:close] + f'\n\t\t{refresh}' + block[close:]
                  text = text[:start] + block + text[end:]
              target.write_text(text, encoding='utf-8')

          def patch_validator(path: str) -> None:
              replace_once(
                  path,
                  '    helper_generator = read("tools/generate_us04_pop_demand_helpers.sh")\n',
                  '    helper_generator = read("tools/generate_us04_pop_demand_helpers.sh")\n'
                  '    generated_helpers = read("in_game/common/scripted_effects/cbp_us04_pop_demand_generated.txt")\n',
              )
              replace_once(
                  path,
                  '        expect("target = scope:cbp_good" not in proxy_writer and "key = scope:cbp_good" not in proxy_writer, f"US-04 {estate} proxy writer must not persist proxy records under a saved-scope key")\n'
                  '    proxy_reset = block(demand_resolver, "cbp_reset_us04_location_estate_proxy")',
                  '        expect("target = scope:cbp_good" not in proxy_writer and "key = scope:cbp_good" not in proxy_writer, f"US-04 {estate} proxy writer must not persist proxy records under a saved-scope key")\n'
                  '        expect("cbp_us04_refresh_location_sparse_index_good_$good$ = yes" in proxy_writer, f"US-04 {estate} proxy writer must refresh sparse membership")\n'
                  '    proxy_reset = block(demand_resolver, "cbp_reset_us04_location_estate_proxy")',
              )
              replace_once(
                  path,
                  '    expect("target = scope:cbp_good" not in proxy_reset and "key = scope:cbp_good" not in proxy_reset, "US-04 proxy reset must not use saved-scope keys")\n'
                  '    expect("demands_goods_by_pops = goods:__GOOD__" in market_monthly_reconciliation,',
                  '    expect("target = scope:cbp_good" not in proxy_reset and "key = scope:cbp_good" not in proxy_reset, "US-04 proxy reset must not use saved-scope keys")\n'
                  '    expect("cbp_us04_refresh_location_sparse_index_good_$good$ = yes" in proxy_reset, "US-04 proxy reset must refresh sparse membership")\n'
                  '    expect("demands_goods_by_pops = goods:__GOOD__" in market_monthly_reconciliation,',
              )
              replace_once(
                  path,
                  '    expect("cbp_monthly_assess_location_estate_consumption_all_goods" in helper_generator, "US-04 helper generator must emit Estate-level location assessment dispatch")\n'
                  '    expect(not has_executable_every_location(integration),',
                  '    expect("cbp_monthly_assess_location_estate_consumption_all_goods" in helper_generator, "US-04 helper generator must emit Estate-level location assessment dispatch")\n'
                  '    expect("cbp_monthly_process_us04_sparse_index_all_goods" in helper_generator, "US-04 helper generator must emit the sparse monthly dispatcher")\n'
                  '    expect("cbp_{good}_us04_active_locations" in helper_generator, "US-04 helper generator must emit country-owned per-good active-location lists")\n'
                  '    expect("cbp_wheat_us04_active_locations" in generated_helpers, "US-04 generated output must contain the wheat sparse work list")\n'
                  '    expect(not has_executable_every_location(integration),',
              )
              replace_once(
                  path,
                  '    expect("every_market_present_in_country = {" in monthly_country_runtime, "US-04 current-country monthly runtime must iterate country markets before goods and locations")\n'
                  '    expect("cbp_monthly_assess_country_market_estate_consumption_all_goods = yes" in monthly_country_runtime, "US-04 current-country monthly runtime must call the Estate-level market/good-first dispatcher")\n'
                  '    expect("cbp_monthly_reconcile_location_pop_demand_all_goods = yes" not in monthly_country_runtime, "US-04 current-country monthly runtime must not scan every owned location before the market/good gate")',
                  '    expect("cbp_prepare_us04_sparse_index_for_current_country = yes" in monthly_country_runtime, "US-04 current-country monthly runtime must prepare the sparse country index")\n'
                  '    expect("cbp_monthly_process_us04_sparse_index_all_goods = yes" in monthly_country_runtime, "US-04 current-country monthly runtime must call the sparse per-good active-location dispatcher")\n'
                  '    expect("every_market_present_in_country = {" not in monthly_country_runtime, "US-04 current-country monthly runtime must not retain the dense country-market iterator")\n'
                  '    expect("every_owned_location = {" not in monthly_country_runtime, "US-04 current-country monthly runtime must not retain a dense owned-location iterator")\n'
                  '    expect("cbp_monthly_assess_country_market_estate_consumption_all_goods = yes" not in monthly_country_runtime, "US-04 normal monthly runtime must not call the dense market/good-first compatibility dispatcher")',
              )

          patch_generator('tools/generate_us04_pop_demand_helpers.sh')
          patch_resolver('in_game/common/scripted_effects/cbp_stock_demand_resolver_effects.txt')
          patch_validator('tools/validate_us04_pop_demand_architecture.py')
          PY
          rm .github/workflows/apply-us04-sparse-fixup.yml
          rm .github/workflows/apply-us04-sparse-fixup-pr.yml

      - name: Commit source updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Perf: finalize sparse US-04 admission and writer repair"
          git push origin HEAD:perf/sparse-us04-work-indexes
