name: Apply US04 Sparse Fixup PR

on:
  pull_request:

permissions:
  contents: write

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: perf/sparse-us04-work-indexes
          fetch-depth: 0

      - name: Run embedded fixup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-us04-sparse-fixup.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          body = text[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines()) + "\n"
          Path('/tmp/apply_us04_sparse_fixup.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply_us04_sparse_fixup.py
          rm .github/workflows/apply-us04-sparse-fixup.yml
          rm .github/workflows/apply-us04-sparse-fixup-pr.yml

      - name: Commit source updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Perf: finalize sparse US-04 admission and writer repair"
          git push origin HEAD:perf/sparse-us04-work-indexes
