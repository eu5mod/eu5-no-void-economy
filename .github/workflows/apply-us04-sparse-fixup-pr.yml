name: Apply US04 Sparse Fixup PR

on:
  pull_request:

permissions:
  contents: write

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: perf/sparse-us04-work-indexes
          fetch-depth: 0

      - name: Extract embedded fixup
        run: |
          awk '
            /          python3 - <<.PY./ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-us04-sparse-fixup.yml > /tmp/apply_us04_sparse_fixup.py
          test -s /tmp/apply_us04_sparse_fixup.py
          cp /tmp/apply_us04_sparse_fixup.py apply-us04-sparse-fixup.py

      - name: Run embedded fixup
        run: |
          set -o pipefail
          python3 /tmp/apply_us04_sparse_fixup.py 2>&1 | tee apply-us04-sparse-fixup.log
          rm .github/workflows/apply-us04-sparse-fixup.yml
          rm .github/workflows/apply-us04-sparse-fixup-pr.yml

      - name: Upload fixup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apply-us04-sparse-fixup-diagnostics
          path: |
            apply-us04-sparse-fixup.py
            apply-us04-sparse-fixup.log
          if-no-files-found: ignore

      - name: Commit source updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Perf: finalize sparse US-04 admission and writer repair"
          git push origin HEAD:perf/sparse-us04-work-indexes
