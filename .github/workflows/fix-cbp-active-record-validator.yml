name: Fix CBP active-record validator

on:
  pull_request:
    branches:
      - us-17-trade-reconciliation
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: fix-cbp-active-record-validator
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'refactor/cbp-variable-prefixes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stacked branch
        uses: actions/checkout@v4
        with:
          ref: refactor/cbp-variable-prefixes
          fetch-depth: 0

      - name: Correct active-record assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/validate_module_packages.sh')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'modeu5_wheat_us00_active_record_by_market',
              'cbp_wheat_us00_active_record_by_market',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit assertion correction
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes required.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tools/validate_module_packages.sh
            git commit -m 'Correct CBP active-record validator token'
            git push origin HEAD:refactor/cbp-variable-prefixes
          fi

      - name: Regenerate and validate with fail-fast semantics
        run: |
          set -euo pipefail
          ./tools/generate_all.sh
          python3 tools/cbp_variable_prefixes.py --check
          ./tools/validate_generators.sh
          ./tools/validate_module_packages.sh
          ./tools/audit_modeu5_persistent_state.sh
          python3 ./tools/validate_ci_static_contracts.py
          git diff --check
