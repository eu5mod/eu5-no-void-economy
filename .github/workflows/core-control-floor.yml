name: Core Control Floor

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate permanent owner-core Control floor
        run: python3 tools/validate_cbp_core_control_floor.py

      - name: Validate CBP script safety
        run: bash tools/validate_cbp_script_safety.sh

      - name: Validate static contracts
        id: static-contracts
        shell: bash
        run: |
          set +e
          python3 tools/validate_ci_static_contracts.py > core-control-floor-static-contracts.log 2>&1
          status=$?
          cat core-control-floor-static-contracts.log
          exit $status

      - name: Upload static-contract log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-control-floor-static-contracts
          path: core-control-floor-static-contracts.log
