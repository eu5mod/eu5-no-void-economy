le('cbp_perf14_ai_diag_reason_zero_capacity').GetValue|0]#!\nNegative capacity: #Y [ROOT.GetVariable('cbp_perf14_ai_diag_reason_negative_capacity').GetValue|0]#!\nOvermaterialized: #Y [ROOT.GetVariable('cbp_perf14_ai_diag_reason_overmaterialized').GetValue|0]#!\nValidation failure: #Y [ROOT.GetVariable('cbp_perf14_ai_diag_reason_validation').GetValue|0]#!"
