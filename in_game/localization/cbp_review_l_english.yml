l_english:
 cbp_review.1.title: "The Day the World Did Not Drown"
 cbp_review.1.desc: "On 20 February 1524, Europe was supposed to drown. At least, that was the rumor: Johannes Stöffler's old astrological warning had escaped into almanacs, broadsheets, and tavern talk. Some people built boats. Some people mocked the boats. Everyone, briefly, checked the sky.\n\nThe waters have not swallowed the world, but one printed rumor has reached our desk: Your voice can influence the game editor.\n\nIf you enjoy this mod, please leave a comment on the mod post, this allow us to ask for changes & modding tools to Paradox (the editor)."
 cbp_review.1.historical_info: "In 1499, the mathematician and astrologer Johannes Stöffler predicted a major deluge for 20 February 1524. The scare became a memorable early-modern example of printed prophecy, rumor, and public panic."
 cbp_review.1.a: "I will support the mod on Paradox Plaza."
 cbp_review.1.b: "I won't."
