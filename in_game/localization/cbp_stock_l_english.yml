 cbp_revalidate_debug.99.title: "ModeU5 Main Revalidation Result"
 cbp_revalidate_debug.99.desc: "The revalidation chain finished. The detailed source of truth is debug.log. Run tools/summarize_test_cbp_logs.sh after closing EU5 to get entered/pass/fail/blocked counts and the exact scenario lines."
