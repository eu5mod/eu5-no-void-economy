 cbp_revalidate_debug.1.title: "ModeU5 Main Revalidation"
 cbp_revalidate_debug.1.desc: "Run the main deterministic ModeU5 validation chain with delayed steps. The chain logs each scenario as ModeU5 TEST ENTERED/PASS/FAIL/BLOCKED so tools/summarize_test_cbp_logs.sh can produce a compact review summary."
