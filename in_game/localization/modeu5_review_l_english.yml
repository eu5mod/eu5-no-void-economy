l_english:
 modeu5_review.1.title: "The Day the World Did Not Drown"
 modeu5_review.1.desc: "On 20 February 1524, Europe was supposed to drown. At least, that was the rumor: Johannes Stöffler's old astrological warning had escaped into almanacs, broadsheets, and tavern talk. Some people built boats. Some people mocked the boats. Everyone, briefly, checked the sky.\n\nThe waters have not swallowed the world, but one printed rumor has reached our desk: No Void Economy survives on word of mouth. If you enjoy ModeU5, please leave a comment on the mod post or a review before the next pamphlet claims our ledgers cause eclipses."
 modeu5_review.1.historical_info: "In 1499, the mathematician and astrologer Johannes Stöffler predicted a major deluge for 20 February 1524. The scare became a memorable early-modern example of printed prophecy, rumor, and public panic."
 modeu5_review.1.a: "Post the pamphlet."
 modeu5_review.1.b: "Seal the rumor."
