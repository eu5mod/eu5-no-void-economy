l_english:
 modeu5_review.1.title: "The Press Needs Your Voice"
 modeu5_review.1.desc: "Around 1450, Johannes Gutenberg turned metal type, ink, and a press into a new way for ideas to travel. Pamphlets, proclamations, and rumors could cross borders faster than any courier.\n\nModeU5 lives by the same fragile art: a good message copied, shared, and discussed. If you enjoy No Void Economy, please take a moment to comment on the mod post or leave a review. Your words help other players discover the project, and they help us keep improving it."
 modeu5_review.1.historical_info: "Johannes Gutenberg's movable-type press in Mainz became one of the great engines of mass communication in Europe. This reminder fires after 1450 as a small, thematic nudge rather than a gameplay reward."
 modeu5_review.1.a: "I'll spread the word."
 modeu5_review.1.b: "Return to the ledger."
