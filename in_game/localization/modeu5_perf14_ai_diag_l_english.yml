 modeu5_perf14_ai_diag.2.desc: "PERF-14 AI human-relevant-market promotion diagnostic.\n\nFixture: #Y [THIS.GetVariable('modeu5_perf14_ai_diag_fixture').GetValue|0]#!  (1=ENG, 2=FRA, 3=POR, 0=none)\n\nRelevant list after mark: #Y [THIS.GetVariable('modeu5_perf14_ai_diag_relevant_list').GetValue|0]#!\nDetailed accounting: #Y [THIS.GetVariable('modeu5_perf14_ai_diag_detailed').GetValue|0]#!\nFallback: #Y [THIS.GetVariable('modeu5_perf14_ai_diag_fallback').GetValue|0]#!\nBlocked: #Y [THIS.GetVariable('modeu5_perf14_ai_diag_blocked').GetValue|0]#!\nPromotion attempted: #Y [THIS.GetVariable('modeu5_perf14_ai_diag_attempted').GetValue|0]#!\nPromotion succeeded: #Y [THIS.GetVariable('modeu5_perf14_ai_diag_succeeded').GetValue|0]#!\nMarket promoted: #Y [THIS.GetVariable('modeu5_perf14_ai_diag_promoted').GetValue|0]#!\n\nFailure reasons:\nNot relevant: #Y [THIS.GetVariable('modeu5_perf14_ai_diag_reason_not_relevant').GetValue|0]#!\nZero capacity: #Y [THIS.GetVariable('modeu5_perf14_ai_diag_reason_zero_capacity').GetValue|0]#!\nNegative capacity: #Y [THIS.GetVariable('modeu5_perf14_ai_diag_reason_negative_capacity').GetValue|0]#!\nOvermaterialized: #Y [THIS.GetVariable('modeu5_perf14_ai_diag_reason_overmaterialized').GetValue|0]#!\nValidation failure: #Y [THIS.GetVariable('modeu5_perf14_ai_diag_reason_validation').GetValue|0]#!"
