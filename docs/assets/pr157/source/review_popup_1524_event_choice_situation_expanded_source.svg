<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="storm_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8aa4ad"/>
      <stop offset="0.58" stop-color="#668991"/>
      <stop offset="1" stop-color="#d6ad73"/>
    </linearGradient>
    <linearGradient id="flood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a9aab"/>
      <stop offset="1" stop-color="#3f7890"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="1524"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.045"/></feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
    <style>
      .ink{stroke:#38271b;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .thin{stroke:#38271b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .paper{fill:#f3dfb2;stroke:#38271b;stroke-width:5;stroke-linejoin:round}
      .town{fill:#ae8056;stroke:#38271b;stroke-width:5;stroke-linejoin:round}
      .roof{fill:#7c4b48;stroke:#38271b;stroke-width:5;stroke-linejoin:round}
      .wood{fill:#906039;stroke:#38271b;stroke-width:6;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#storm_sky)"/>
  <rect x="8" y="8" width="1584" height="884" class="ink" opacity="0.92"/>

  <!-- layered storm clouds, more like the situation art -->
  <g fill="#6f858d" opacity="0.58">
    <ellipse cx="120" cy="130" rx="230" ry="70"/><ellipse cx="285" cy="102" rx="220" ry="78"/>
    <ellipse cx="540" cy="145" rx="260" ry="76"/><ellipse cx="735" cy="112" rx="210" ry="70"/>
    <ellipse cx="1000" cy="132" rx="285" ry="82"/><ellipse cx="1235" cy="98" rx="235" ry="75"/>
    <ellipse cx="1460" cy="148" rx="285" ry="78"/>
  </g>

  <!-- omen charts -->
  <g class="thin" opacity="0.9">
    <g transform="translate(250 125)"><circle r="58"/><circle r="26"/><path d="M0,-58 V58M-58,0 H58M-41,-41 L41,41M41,-41 L-41,41"/></g>
    <g transform="translate(535 175)"><circle r="42"/><path d="M0,-42 V42M-42,0 H42M-30,-30 L30,30M30,-30 L-30,30"/></g>
    <g transform="translate(1185 120)"><circle r="55"/><circle r="24"/><path d="M0,-55 V55M-55,0 H55M-39,-39 L39,39M39,-39 L-39,39"/></g>
  </g>

  <!-- larger town line -->
  <g transform="translate(0 540)">
    <rect x="25" y="-110" width="92" height="110" class="town"/><path d="M12 -110 L72 -165 L132 -110" class="roof"/>
    <rect x="145" y="-155" width="110" height="155" class="town"/><path d="M132 -155 L202 -224 L272 -155" class="roof"/>
    <rect x="285" y="-118" width="100" height="118" class="town"/><path d="M272 -118 L337 -174 L402 -118" class="roof"/>
    <rect x="430" y="-195" width="108" height="195" class="town"/><path d="M415 -195 L485 -278 L558 -195" class="roof"/>
    <rect x="590" y="-128" width="104" height="128" class="town"/><path d="M576 -128 L644 -188 L710 -128" class="roof"/>
    <rect x="750" y="-165" width="112" height="165" class="town"/><path d="M736 -165 L808 -235 L880 -165" class="roof"/>
    <rect x="910" y="-122" width="104" height="122" class="town"/><path d="M896 -122 L964 -182 L1030 -122" class="roof"/>
    <rect x="1070" y="-182" width="114" height="182" class="town"/><path d="M1054 -182 L1130 -252 L1204 -182" class="roof"/>
    <rect x="1240" y="-122" width="104" height="122" class="town"/><path d="M1226 -122 L1292 -180 L1360 -122" class="roof"/>
    <rect x="1400" y="-170" width="108" height="170" class="town"/><path d="M1385 -170 L1456 -242 L1528 -170" class="roof"/>
  </g>

  <!-- flood water -->
  <path d="M0 505 C150 440 275 545 420 495 C580 435 715 555 875 490 C1045 420 1195 545 1360 490 C1485 448 1550 500 1600 472 V900 H0 Z" fill="url(#flood)" stroke="#38271b" stroke-width="7" opacity="0.92"/>
  <path d="M0 610 C160 560 305 650 460 590 C620 535 760 650 920 588 C1080 530 1235 642 1395 585 C1505 548 1568 595 1600 570" class="thin" opacity="0.78"/>
  <path d="M0 720 C150 675 300 750 465 700 C625 648 775 750 935 700 C1100 650 1250 745 1410 700 C1515 670 1570 710 1600 690" class="thin" opacity="0.78"/>

  <!-- printing press and crowd silhouettes -->
  <g transform="translate(78 655) scale(1.18)">
    <rect x="0" y="0" width="245" height="25" class="wood"/>
    <rect x="30" y="-150" width="26" height="220" class="wood"/>
    <rect x="200" y="-150" width="26" height="220" class="wood"/>
    <rect x="10" y="-150" width="235" height="26" class="wood"/>
    <path d="M128 -190 V-70M82 -180 H176" class="ink"/>
    <polygon points="96,-46 208,-65 220,45 105,55" class="paper"/>
  </g>

  <g>
    <g transform="translate(415 660)"><path d="M0 0 L26 86 L-26 86 Z" fill="#874f47" stroke="#38271b" stroke-width="5"/><circle cy="-30" r="16" fill="#c99363" stroke="#38271b" stroke-width="4"/><polygon points="34,24 90,10 98,60 40,75" class="paper"/></g>
    <g transform="translate(595 710)"><path d="M0 0 L26 86 L-26 86 Z" fill="#657282" stroke="#38271b" stroke-width="5"/><circle cy="-30" r="16" fill="#c99363" stroke="#38271b" stroke-width="4"/><polygon points="34,24 90,10 98,60 40,75" class="paper"/></g>
    <g transform="translate(805 675)"><path d="M0 0 L26 86 L-26 86 Z" fill="#827847" stroke="#38271b" stroke-width="5"/><circle cy="-30" r="16" fill="#c99363" stroke="#38271b" stroke-width="4"/><polygon points="34,24 90,10 98,60 40,75" class="paper"/></g>
    <g transform="translate(1045 720)"><path d="M0 0 L26 86 L-26 86 Z" fill="#705745" stroke="#38271b" stroke-width="5"/><circle cy="-30" r="16" fill="#c99363" stroke="#38271b" stroke-width="4"/><polygon points="34,24 90,10 98,60 40,75" class="paper"/></g>
  </g>

  <!-- printed rumors carried by wind -->
  <g opacity="0.96">
    <polygon points="360,260 435,238 448,302 368,324" class="paper"/>
    <polygon points="575,300 655,278 670,346 585,368" class="paper"/>
    <polygon points="815,245 895,220 910,292 828,318" class="paper"/>
    <polygon points="1060,300 1140,278 1156,350 1072,372" class="paper"/>
    <polygon points="1320,245 1405,222 1420,295 1332,318" class="paper"/>
  </g>

  <g fill="#906039" stroke="#38271b" stroke-width="5">
    <ellipse cx="540" cy="795" rx="56" ry="18"/>
    <ellipse cx="940" cy="820" rx="64" ry="20"/>
    <ellipse cx="1250" cy="775" rx="54" ry="18"/>
  </g>

  <rect x="0" y="820" width="1600" height="80" fill="#5a4330" opacity="0.72"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.18"/>
</svg>
