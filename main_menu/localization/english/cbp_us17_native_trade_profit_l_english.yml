l_english:
 AUTO_MODIFIER_NAME_cbp_us17_selling_efficiency_cancellation: "(CBP) Selling Efficiency Route Loss"
 AUTO_MODIFIER_DESC_cbp_us17_selling_efficiency_cancellation: "Cancels the native Selling Efficiency baseline and replaces it with the diminishing CBP route-loss coefficient shared with physical goods lost in transit."

 AUTO_MODIFIER_NAME_cbp_us17_import_efficiency_cancellation: "(CBP) Import Efficiency Redirected"
 AUTO_MODIFIER_DESC_cbp_us17_import_efficiency_cancellation: "Removes Import Efficiency from absolute trade-price formation and redirects its value to Merchant Maintenance."

 AUTO_MODIFIER_NAME_cbp_us17_export_efficiency_cancellation: "(CBP) Export Efficiency Redirected"
 AUTO_MODIFIER_DESC_cbp_us17_export_efficiency_cancellation: "Removes Export Efficiency from absolute trade-price formation and redirects its value to Merchant Maintenance."

 AUTO_MODIFIER_NAME_cbp_us17_merchant_maintenance_reconciliation: "(CBP) Reciprocal Trade Maintenance"
 AUTO_MODIFIER_DESC_cbp_us17_merchant_maintenance_reconciliation: "Applies Merchant Maintenance Efficiency as 1 minus the reciprocal of 1 plus half native maintenance plus five times combined Import and Export Efficiency."
