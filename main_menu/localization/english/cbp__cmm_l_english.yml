l_english:
 # Mod
 no_void_economy_name: "Community Balance Patch"
 no_void_economy_desc: "A modular balance package for EU5 focused on stock-aware economics, less punitive balancing, and clearer optional gameplay improvements."

 # General Gameplay  (cbp_general_gameplay_tab) Tab
 no_void_economy__cbp_general_gameplay_tab_name: "General Gameplay "
 ## Strategic Gameplay (cbp_general_gameplay_gameplay_group) Group
 no_void_economy__cbp_general_gameplay_tab__cbp_general_gameplay_gameplay_group_name: "Strategic Gameplay"
 no_void_economy__cbp_general_gameplay_gameplay_war_exhaustion_political_pressure_settings_name: "Improve War Exhaustion Pressure"
 no_void_economy__cbp_general_gameplay_gameplay_war_exhaustion_political_pressure_settings_desc: "Turns War Exhaustion into visible internal political pressure instead of hidden morale, production, trade, and population-growth penalties. High exhaustion should pressure stability, legitimacy, and rebel control while keeping War Exhaustion as the single source of truth."
 no_void_economy__cbp_general_gameplay_gameplay_trade_rework_settings_name: "Make Trade Profits One-Way"
 no_void_economy__cbp_general_gameplay_gameplay_trade_rework_settings_desc: "Balances trade so profit comes from the price difference between two markets after logistics cost, preventing the same route from being profitable in both directions."
 no_void_economy__cbp_general_gameplay_gameplay_empire_military_difficulties_settings_name: "Add Imperial Hubris"
 no_void_economy__cbp_general_gameplay_gameplay_empire_military_difficulties_settings_desc: "Makes long-peace Great Powers accumulate Imperial Complacency, representing softened military institutions and reduced pressure to reform. Serious wars against rival Great Powers burn complacency down and make unchecked empires less permanently stable."
 ## Country Stock Economy (cbp_general_gameplay_country_level_stocks_group) Group
 no_void_economy__cbp_general_gameplay_tab__cbp_general_gameplay_country_level_stocks_group_name: "Country Stock Economy"
 no_void_economy__cbp_general_gameplay_tab__cbp_general_gameplay_country_level_stocks_group_desc: "Core NVE behavior that makes produced goods matter only when they can actually be sold, stored, transferred, or consumed."
 no_void_economy__cbp_general_gameplay_country_level_stocks_countries_have_own_stocks_settings_name: "Give Countries Their Own Stocks"
 no_void_economy__cbp_general_gameplay_country_level_stocks_countries_have_own_stocks_settings_desc: "Controls how broadly NVE applies country-level stock accounting. Performance Mode keeps detailed accounting for human-relevant markets; Normal Mode keeps broader accounting; Deactivated leaves the main NVE behavior off where supported."
 no_void_economy__cbp_general_gameplay_country_level_stocks_countries_have_own_stocks_settings_option_1_name: "Activate (Performance Mode)"
 no_void_economy__cbp_general_gameplay_country_level_stocks_countries_have_own_stocks_settings_option_1_desc: "Detailed country-market accounting is kept for human-played countries in their relevant markets. Other supported activity falls back to lighter market-level accounting. Recommended for smoother gameplay."
 no_void_economy__cbp_general_gameplay_country_level_stocks_countries_have_own_stocks_settings_option_2_name: "Activate (Normal Mode)"
 no_void_economy__cbp_general_gameplay_country_level_stocks_countries_have_own_stocks_settings_option_2_desc: "Detailed country-market accounting remains broadly available. More complete for diagnostics, but heavier."
 no_void_economy__cbp_general_gameplay_country_level_stocks_countries_have_own_stocks_settings_option_3_name: "Deactivated"
 no_void_economy__cbp_general_gameplay_country_level_stocks_countries_have_own_stocks_settings_option_3_desc: "Disables the main NVE economic behavior where supported."
 no_void_economy__cbp_general_gameplay_country_level_stocks_only_sold_goods_create_revenue_settings_name: "Only Sold Goods Generate Income"
 no_void_economy__cbp_general_gameplay_country_level_stocks_only_sold_goods_create_revenue_settings_desc: "Stops unsold RGO and building output from creating free income for estates or the crown. Production becomes revenue only when goods are sold, making overproduction and market access economically meaningful."
 no_void_economy__cbp_general_gameplay_country_level_stocks_boycotts_wars_block_resource_buying_settings_name: "Block Buyers During Boycotts and Wars"
 no_void_economy__cbp_general_gameplay_country_level_stocks_boycotts_wars_block_resource_buying_settings_desc: "Prevents hostile or boycotted countries from freely buying your resources through a market center you do not own. Trade access should reflect diplomatic conflict, not only ownership of the market center."
 ## AI Support (cbp_general_gameplay_other_group) Group
 no_void_economy__cbp_general_gameplay_tab__cbp_general_gameplay_other_group_name: "AI Support"
 no_void_economy__cbp_general_gameplay_other_extra_revenue_to_ai_settings_name: "Support AI Revenue"
 no_void_economy__cbp_general_gameplay_other_extra_revenue_to_ai_settings_desc: "Compensates AI countries when they cannot yet plan around the stricter stock economy as well as a human player. This is intended as a balance aid, not as a permanent replacement for better AI strategy."

 # Economic Balance (cbp_economic_balance_tab) Tab
 no_void_economy__cbp_economic_balance_tab_name: "Economic Balance"
 ## Economic Design (cbp_economic_balance_design_group) Group
 no_void_economy__cbp_economic_balance_tab__cbp_economic_balance_design_group_name: "Economic Design"
 no_void_economy__cbp_economic_balance_design_activate_goods_decay_settings_name: "Add Carrying Costs to Stockpiles"
 no_void_economy__cbp_economic_balance_design_activate_goods_decay_settings_desc: "Applies monthly stock decay so stored goods slowly lose value instead of remaining free forever. The target design is a configurable 1% monthly loss applied to country stocks, with market totals reduced by exactly the same amount."
 no_void_economy__cbp_economic_balance_design_sliders_adjustments_settings_name: "Base Sliders on Wealth"
 no_void_economy__cbp_economic_balance_design_sliders_adjustments_settings_desc: "Balances Stability and qualifying Court or Government Power costs around Wealth plus Trade Income rather than Tax Base, so slider pressure follows the real economic base of the country."
 no_void_economy__cbp_economic_balance_design_pop_consumption_influenced_by_offer_demand_settings_name: "Pop consumption influenced by offer & demand"
 no_void_economy__cbp_economic_balance_design_pop_consumption_influenced_by_offer_demand_settings_desc: "Pop consumption starts 20% above vanilla, then the consumption of each good increases or decreases yearly depending on whether supply is met, reflecting population tendencies to adapt consumption habits to supply."
 ## Economic Balance (cbp_economic_balance_balance_group) Group
 no_void_economy__cbp_economic_balance_tab__cbp_economic_balance_balance_group_name: "Economic Balance"
 no_void_economy___name: "Remove Control Penalty on research (BLOCKED BY PARADOX)"
 no_void_economy___desc: ""
 no_void_economy___name: ""
 no_void_economy___desc: ""
 ## Mandatory Base (cbp_economic_balance_mandatorybase_group) Group
 no_void_economy__cbp_economic_balance_tab__cbp_economic_balance_mandatorybase_group_name: "Mandatory Base"
 no_void_economy__cbp_economic_balance_balance_increased_location_specialisation_settings_name: "Reward Local Specialisation"
 no_void_economy__cbp_economic_balance_balance_increased_location_specialisation_settings_desc: "Increases the value of focused local production by raising the production bonus per building level from the vanilla target toward 1.5%, making specialized locations feel more distinct."
 no_void_economy__cbp_economic_balance_balance_marketplace_burgher_power_reduction_settings_name: "Balance Marketplace Power"
 no_void_economy__cbp_economic_balance_balance_marketplace_burgher_power_reduction_settings_desc: "Reduces marketplace Burgher power from the vanilla target toward 5% so trade buildings no longer create a perverse loop where building more marketplaces can reduce trade revenue."
 no_void_economy___name: "RGO prices don't scale with Good's Market Price"
 no_void_economy___desc: ""
 no_void_economy___name: "Maintenance price stabilisation (BLOCKED BY PARADOX)"
 no_void_economy___desc: ""
