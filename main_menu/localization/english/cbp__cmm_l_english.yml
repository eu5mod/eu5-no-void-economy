 # War & Subjects Balance (cbp_war_subjects_balance_tab) Tab
 no_void_economy__cbp_war_subjects_balance_tab_name: "War & Subjects Balance"
 ## Campaign Pressure (cbp_war_subjects_balance_general_group) Group
 no_void_economy__cbp_war_subjects_balance_tab__cbp_war_subjects_balance_general_group_name: "Campaign Pressure"
 no_void_economy__cbp_war_subjects_balance_general_difficulty_settings_name: "Choose Campaign Pressure"
 no_void_economy__cbp_war_subjects_balance_general_difficulty_settings_desc: "Sets how much the balance package pushes back against runaway expansion. Historical pressure is harsher and may make wars harder to sustain; Gameful pressure keeps more room for player growth."
 no_void_economy__cbp_war_subjects_balance_general_difficulty_settings_option_1_name: "Historical Pressure"
 no_void_economy__cbp_war_subjects_balance_general_difficulty_settings_option_2_name: "Gameful Pressure"
 ## Subject Design (cbp_war_subjects_balance_design_group) Group
 no_void_economy__cbp_war_subjects_balance_tab__cbp_war_subjects_balance_design_group_name: "Subject Design"
 no_void_economy__cbp_war_subjects_balance_design_overlord_declares_war_settings_name: "Let Overlords Answer Rebellions"
 no_void_economy__cbp_war_subjects_balance_design_overlord_declares_war_settings_desc: "Changes independence pressure so the original overlord gets an active response path instead of every separatist crisis immediately becoming a one-sided breakaway. Intended to create strategic rebel containment without hiding the conflict."
 no_void_economy__cbp_war_subjects_balance_design_persistence_of_resources_settings_name: "Preserve Subject Resources"
 no_void_economy__cbp_war_subjects_balance_design_persistence_of_resources_settings_desc: "Keeps inherited resources such as money, debt, armies, navies, or stock-related state meaningful when subjects are annexed or reorganized, instead of letting valuable state disappear without explanation."
 ## War Balance (cbp_war_subjects_balance_balance_group) Group
 no_void_economy__cbp_war_subjects_balance_tab__cbp_war_subjects_balance_balance_group_name: "War Balance"
 no_void_economy__cbp_war_subjects_balance_balance_shorter_wars_settings_name: "Encourage Shorter Wars"
 no_void_economy__cbp_war_subjects_balance_balance_shorter_wars_settings_desc: "Improves peace pressure so wars that are strategically decided end sooner. This should reduce drawn-out conflicts and make AI peace acceptance better reflect the actual military and political situation."
 no_void_economy__cbp_war_subjects_balance_balance_adjust_rebel_threshold_settings_name: "Balance Rebel Thresholds"
 no_void_economy__cbp_war_subjects_balance_balance_adjust_rebel_threshold_settings_desc: "Tunes rebellion thresholds so internal unrest becomes a meaningful constraint on overextension without turning every campaign into constant punitive revolts."

 # Debug & Audit (cbp_debug_audit_tab) Tab
 no_void_economy__cbp_debug_audit_tab_name: "Debug & Audit"
 ## Misc (cbp_debug_audit_misc_group) Group
 no_void_economy__cbp_debug_audit_tab__cbp_debug_audit_misc_group_name: "Misc"
 no_void_economy__cbp_debug_audit_misc_review_pop_settings_name: "Review Popup"
 no_void_economy__cbp_debug_audit_misc_review_pop_settings_desc: "Shows one optional, historical-fun-fact reminder asking for a comment or review after 20 February 1524. The popup disables this setting after either answer."
 ## Debug & Audit (cbp_debug_audit_debug_audit_group) Group
 no_void_economy__cbp_debug_audit_tab__cbp_debug_audit_debug_audit_group_name: "Debug & Audit"
 no_void_economy__cbp_debug_audit_debug_audit_debug_messages_settings_name: "Debug Messages"
 no_void_economy__cbp_debug_audit_debug_audit_debug_messages_settings_desc: "Controls optional NVE diagnostic messages. Important consistency errors are still reported even when this is off."
 no_void_economy__cbp_debug_audit_debug_audit_debug_messages_settings_option_1_name: "Off (Recommended)"
 no_void_economy__cbp_debug_audit_debug_audit_debug_messages_settings_option_1_desc: "Hide optional NVE debug messages. Recommended for normal gameplay."
 no_void_economy__cbp_debug_audit_debug_audit_debug_messages_settings_option_2_name: "Basic"
 no_void_economy__cbp_debug_audit_debug_audit_debug_messages_settings_option_2_desc: "Show useful NVE status messages, including setup checks, package state, stock consistency issues, and fallback use."
 no_void_economy__cbp_debug_audit_debug_audit_debug_messages_settings_option_3_name: "Detailed Logs - Slow"
 no_void_economy__cbp_debug_audit_debug_audit_debug_messages_settings_option_3_desc: "Warning: shows detailed economic debug messages, including inputs, stock changes, and diagnostic values. This can create heavy log output and may reduce smoothness during monthly ticks."
 no_void_economy__cbp_debug_audit_debug_audit_monthly_stock_check_settings_name: "Monthly Stock Audit"
 no_void_economy__cbp_debug_audit_debug_audit_monthly_stock_check_settings_desc: "Runs an additional monthly consistency audit over the stock economy. Use it to validate campaigns or investigate discrepancies; leave it off for normal performance."
 no_void_economy__cbp_debug_audit_debug_audit_monthly_stock_check_settings_option_1_name: "Off (Recommended)"
 no_void_economy__cbp_debug_audit_debug_audit_monthly_stock_check_settings_option_1_desc: "Do not run the heavier monthly stock check. Recommended for normal gameplay. Manual debug checks and long-term consistency checks remain available."
 no_void_economy__cbp_debug_audit_debug_audit_monthly_stock_check_settings_option_2_name: "On - Slower Monthly Ticks"
 no_void_economy__cbp_debug_audit_debug_audit_monthly_stock_check_settings_option_2_desc: "Warning: runs an additional stock consistency check every month. Useful for testing or validating a campaign, but it can noticeably reduce game smoothness during monthly ticks."
 no_void_economy__cbp_debug_audit_debug_audit_save_mode_settings_name: "Save Detail"
 no_void_economy__cbp_debug_audit_debug_audit_save_mode_settings_desc: "Controls how much NVE economic state is kept between monthly ticks. Lighter modes improve performance; heavier modes preserve more detail for audits, comparisons, and debugging."
 no_void_economy__cbp_debug_audit_debug_audit_save_mode_settings_option_1_name: "Light Save (Recommended)"
 no_void_economy__cbp_debug_audit_debug_audit_save_mode_settings_option_1_desc: "Keeps only the economic data needed for gameplay. Recommended for better performance, especially during monthly ticks."
 no_void_economy__cbp_debug_audit_debug_audit_save_mode_settings_option_2_name: "Balanced Save"
 no_void_economy__cbp_debug_audit_debug_audit_save_mode_settings_option_2_desc: "Keeps more economic detail for markets connected to human-played countries, while limiting saved data elsewhere. Good balance between economic tracking and game smoothness."
 no_void_economy__cbp_debug_audit_debug_audit_save_mode_settings_option_3_name: "Complete Save - Slow"
 no_void_economy__cbp_debug_audit_debug_audit_save_mode_settings_option_3_desc: "Warning: keeps all monthly economic details for every market. Useful for testing, comparison, or diagnostics, but can strongly reduce smoothness during monthly ticks."

