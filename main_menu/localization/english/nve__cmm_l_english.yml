  # Debug & Audit (nve_debug_audit_tab) Tab
  no_void_economy__nve_debug_audit_tab_name: "Debug & Audit"
  ## Debug & Audit (nve_debug_audit_debug_audit_group) Group
  no_void_economy__nve_debug_audit_tab__nve_debug_audit_debug_audit_group_name: "Debug & Audit"
  no_void_economy__nve_debug_audit_debug_audit_debug_messages_settings_name: "Debug Messages"
  no_void_economy__nve_debug_audit_debug_audit_debug_messages_settings_desc: "Controls optional NVE diagnostic messages. Important consistency errors are still reported even when this is off."
  no_void_economy__nve_debug_audit_debug_audit_debug_messages_settings_option_1_name: "Off (Recommended)"
  no_void_economy__nve_debug_audit_debug_audit_debug_messages_settings_option_1_desc: "Hide optional NVE debug messages. Recommended for normal gameplay."
  no_void_economy__nve_debug_audit_debug_audit_debug_messages_settings_option_2_name: "Basic"
  no_void_economy__nve_debug_audit_debug_audit_debug_messages_settings_option_2_desc: "Show useful NVE status messages, including setup checks, package state, stock consistency issues, and fallback use."
  no_void_economy__nve_debug_audit_debug_audit_debug_messages_settings_option_3_name: "Detailed Logs - Slow"
  no_void_economy__nve_debug_audit_debug_audit_debug_messages_settings_option_3_desc: "Warning: shows detailed economic debug messages, including inputs, stock changes, and diagnostic values. This can create heavy log output and may reduce smoothness during monthly ticks."
  no_void_economy__nve_debug_audit_debug_audit_monthly_stock_check_settings_name: "Monthly Stock Check"
  no_void_economy__nve_debug_audit_debug_audit_monthly_stock_check_settings_desc: "Controls whether NVE runs an additional stock consistency check every month."
  no_void_economy__nve_debug_audit_debug_audit_monthly_stock_check_settings_option_1_name: "Off (Recommended)"
  no_void_economy__nve_debug_audit_debug_audit_monthly_stock_check_settings_option_1_desc: "Do not run the heavier monthly stock check. Recommended for normal gameplay. Manual debug checks and long-term consistency checks remain available."
  no_void_economy__nve_debug_audit_debug_audit_monthly_stock_check_settings_option_2_name: "On - Slower Monthly Ticks"
  no_void_economy__nve_debug_audit_debug_audit_monthly_stock_check_settings_option_2_desc: "Warning: runs an additional stock consistency check every month. Useful for testing or validating a campaign, but it can noticeably reduce game smoothness during monthly ticks."
  no_void_economy__nve_debug_audit_debug_audit_save_mode_settings_name: "Save mode"
  no_void_economy__nve_debug_audit_debug_audit_save_mode_settings_desc: "Controls how much NVE economic state is kept between monthly ticks."
  no_void_economy__nve_debug_audit_debug_audit_save_mode_settings_option_1_name: "Light Save (Recommended)"
  no_void_economy__nve_debug_audit_debug_audit_save_mode_settings_option_1_desc: "Keeps only the economic data needed for gameplay. Recommended for better performance, especially during monthly ticks."
  no_void_economy__nve_debug_audit_debug_audit_save_mode_settings_option_2_name: "Balanced Save"
  no_void_economy__nve_debug_audit_debug_audit_save_mode_settings_option_2_desc: "Keeps more economic detail for markets connected to human-played countries, while limiting saved data elsewhere. Good balance between economic tracking and game smoothness."
  no_void_economy__nve_debug_audit_debug_audit_save_mode_settings_option_3_name: "Complete Save - Slow"
  no_void_economy__nve_debug_audit_debug_audit_save_mode_settings_option_3_desc: "Warning: keeps all monthly economic details for every market. Useful for testing, comparison, or diagnostics, but can strongly reduce smoothness during monthly ticks."

