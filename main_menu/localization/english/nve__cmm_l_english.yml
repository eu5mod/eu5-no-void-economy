  no_void_economy__nve_general_gameplay_gameplay_trade_rework_settings_name: "(In development) Trade Rework"
  no_void_economy__nve_general_gameplay_gameplay_trade_rework_settings_desc: "The trade profit will be the difference of price between two markets."
  no_void_economy__nve_general_gameplay_gameplay_empire_military_difficulties_settings_name: "(In development) Empire Military Difficulties"
