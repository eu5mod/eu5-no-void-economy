  ## Country Level Stocks (nve_general_gameplay_country_level_stocks_group) Group
  no_void_economy__nve_general_gameplay_tab__nve_general_gameplay_country_level_stocks_group_name: "Country Level Stocks"
  no_void_economy__nve_general_gameplay_tab__nve_general_gameplay_country_level_stocks_group_desc: "Main NVE gameplay behavior."
  no_void_economy__nve_general_gameplay_country_level_stocks_countries_have_own_stocks_settings_name: "Each country have their own stocks"
  no_void_economy__nve_general_gameplay_country_level_stocks_countries_have_own_stocks_settings_desc: "Controls how broadly NVE applies its no-void-economy logic."
  no_void_economy__nve_general_gameplay_country_level_stocks_countries_have_own_stocks_settings_option_1_name: "Activate (Performance Mode)"
  no_void_economy__nve_general_gameplay_country_level_stocks_countries_have_own_stocks_settings_option_1_desc: "Detailed country-market accounting is kept for human-played countries in their relevant markets. Other supported activity falls back to lighter market-level accounting. Recommended for smoother gameplay."
  no_void_economy__nve_general_gameplay_country_level_stocks_countries_have_own_stocks_settings_option_2_name: "Activate (Normal Mode)"
  no_void_economy__nve_general_gameplay_country_level_stocks_countries_have_own_stocks_settings_option_2_desc: "Detailed country-market accounting remains broadly available. More complete for diagnostics, but heavier."
  no_void_economy__nve_general_gameplay_country_level_stocks_countries_have_own_stocks_settings_option_3_name: "Deactivated"
  no_void_economy__nve_general_gameplay_country_level_stocks_countries_have_own_stocks_settings_option_3_desc: "Disables the main NVE economic behavior where supported."
  no_void_economy__nve_general_gameplay_country_level_stocks_only_sold_goods_create_revenue_settings_name: "Only good that are sold generate an income"
  no_void_economy__nve_general_gameplay_country_level_stocks_only_sold_goods_create_revenue_settings_desc: ""
  no_void_economy__nve_general_gameplay_country_level_stocks_boycotts_wars_block_resource_buying_settings_name: "Boycotts & Wars block country from buying your resources "
  no_void_economy__nve_general_gameplay_country_level_stocks_boycotts_wars_block_resource_buying_settings_desc: ""
