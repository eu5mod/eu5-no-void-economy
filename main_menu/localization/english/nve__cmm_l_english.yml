l_english:
 # Mod
 no_void_economy_name: "Community Balance Patch"
 no_void_economy_desc: "This mod provides a wide range of gameplay improvements designed to balance the game."

 # Trade Rework (trade_rework_tab) Tab
 no_void_economy__trade_rework_tab_name: "Trade Rework"
 ## No Void Economy (no_void_economy_group) Group
 no_void_economy__trade_rework_tab__no_void_economy_group_name: "No Void Economy"
 no_void_economy__trade_rework_tab__no_void_economy_group_desc: "Main NVE gameplay behavior."
 no_void_economy__only_sold_goods_create_revenue_nve_setting_name: "Only sold goods create revenue (NVE)"
 no_void_economy__only_sold_goods_create_revenue_nve_setting_desc: "Controls how broadly NVE applies its no-void-economy logic."
 no_void_economy__only_sold_goods_create_revenue_nve_setting_option_1_name: "Activate (Performance Mode)"
 no_void_economy__only_sold_goods_create_revenue_nve_setting_option_1_desc: "Detailed country-market accounting is kept for human-played countries in their relevant markets. Other supported activity falls back to lighter market-level accounting. Recommended for smoother gameplay."
 no_void_economy__only_sold_goods_create_revenue_nve_setting_option_2_name: "Activate (Normal Mode)"
 no_void_economy__only_sold_goods_create_revenue_nve_setting_option_2_desc: "Detailed country-market accounting remains broadly available. More complete for diagnostics, but heavier."
 no_void_economy__only_sold_goods_create_revenue_nve_setting_option_3_name: "Deactivated"
 no_void_economy__only_sold_goods_create_revenue_nve_setting_option_3_desc: "Disables the main NVE economic behavior where supported."
 no_void_economy__activate_goods_decay_setting_name: "(In development) Activate Goods Decay"
 no_void_economy__activate_goods_decay_setting_desc: "Stocks will decay 1% each month."
 ## Trade Rework (trade_rework_group) Group
 no_void_economy__trade_rework_tab__trade_rework_group_name: "Trade Rework"
 no_void_economy__trade_rework_setting_name: "(In development) Trade Rework"
 no_void_economy__trade_rework_setting_desc: "The trade profit will be the difference of price between two markets."
 ## Debug & Audit (debug_audit_group) Group
 no_void_economy__trade_rework_tab__debug_audit_group_name: "Debug & Audit"
 no_void_economy__debug_messages_setting_name: "Debug Messages"
 no_void_economy__debug_messages_setting_desc: "Controls optional NVE diagnostic messages. Important consistency errors are still reported even when this is off."
 no_void_economy__debug_messages_setting_option_1_name: "Off (Recommended)"
 no_void_economy__debug_messages_setting_option_1_desc: "Hide optional NVE debug messages. Recommended for normal gameplay."
 no_void_economy__debug_messages_setting_option_2_name: "Basic"
 no_void_economy__debug_messages_setting_option_2_desc: "Show useful NVE status messages, including setup checks, package state, stock consistency issues, and fallback use."
 no_void_economy__debug_messages_setting_option_3_name: "Detailed Logs - Slow"
 no_void_economy__debug_messages_setting_option_3_desc: "Warning: shows detailed economic debug messages, including inputs, stock changes, and diagnostic values. This can create heavy log output and may reduce smoothness during monthly ticks."
 no_void_economy__monthly_stock_check_setting_name: "Monthly Stock Check"
 no_void_economy__monthly_stock_check_setting_desc: "Controls whether NVE runs an additional stock consistency check every month."
 no_void_economy__monthly_stock_check_setting_option_1_name: "Off (Recommended)"
 no_void_economy__monthly_stock_check_setting_option_1_desc: "Do not run the heavier monthly stock check. Recommended for normal gameplay. Manual debug checks and long-term consistency checks remain available."
 no_void_economy__monthly_stock_check_setting_option_2_name: "On - Slower Monthly Ticks"
 no_void_economy__monthly_stock_check_setting_option_2_desc: "Warning: runs an additional stock consistency check every month. Useful for testing or validating a campaign, but it can noticeably reduce game smoothness during monthly ticks."
 no_void_economy__save_mode_setting_name: "Save mode"
 no_void_economy__save_mode_setting_desc: "Controls how much NVE economic state is kept between monthly ticks."
 no_void_economy__save_mode_setting_option_1_name: "Light Save (Recommended)"
 no_void_economy__save_mode_setting_option_1_desc: "Keeps only the economic data needed for gameplay. Recommended for better performance, especially during monthly ticks."
 no_void_economy__save_mode_setting_option_2_name: "Balanced Save"
 no_void_economy__save_mode_setting_option_2_desc: "Keeps more economic detail for markets connected to human-played countries, while limiting saved data elsewhere. Good balance between economic tracking and game smoothness."
 no_void_economy__save_mode_setting_option_3_name: "Complete Save - Slow"
 no_void_economy__save_mode_setting_option_3_desc: "Warning: keeps all monthly economic details for every market. Useful for testing, comparison, or diagnostics, but can strongly reduce smoothness during monthly ticks."

 # Balance (balance_tab) Tab
 no_void_economy__balance_tab_name: "Balance"
 ## General (general_group) Group
 no_void_economy__balance_tab__general_group_name: "General"
 no_void_economy__difficulty_setting_name: "Difficulty (Read tooltip carefully)"
 no_void_economy__difficulty_setting_desc: "Set a difficulty level."
 no_void_economy__difficulty_setting_option_1_name: "Hard (Historical, you may lose wars)"
 no_void_economy__difficulty_setting_option_2_name: "Normal (Gameful, you might blob)"
 ## War (war_group) Group
 no_void_economy__balance_tab__war_group_name: "War"
 no_void_economy__shorter_wars_setting_name: "(In development) Shorter Wars"
 no_void_economy__shorter_wars_setting_desc: "AI will be smarter in peace acceptance."
 no_void_economy__war_exhaustion_political_pressure_setting_name: "(In development) War Exhaustion - Political Pressure"
 no_void_economy__war_exhaustion_political_pressure_setting_desc: "Implement the impact of war on country stability and government legitimacy."
 ## Economy (economy_group) Group
 no_void_economy__balance_tab__economy_group_name: "Economy"
 no_void_economy__increased_location_specialisation_setting_name: "(In development) Increased Location Specialisation"
 no_void_economy__increased_location_specialisation_setting_desc: ""
 no_void_economy__sliders_adjustments_setting_name: "(In development) Sliders adjustments"
 no_void_economy__sliders_adjustments_setting_desc: ""
 ## Other (other_group) Group
 no_void_economy__balance_tab__other_group_name: "Other"
 no_void_economy__extra_revenue_to_ai_to_compensate_for_lack_of_strategy_setting_name: "(In development) Extra revenue to AI to compensate for lack of strategy"
 no_void_economy__extra_revenue_to_ai_to_compensate_for_lack_of_strategy_setting_desc: ""

