l_english:
 # Mod
 no_void_economy_name: "No Void Economy"
 no_void_economy_desc: "This mod makes the economy more physical: only goods that are actually sold create income. It includes the required No Void Economy core and optional balance extensions."

 # NVE Pack (general_gameplay_tab) Tab
 no_void_economy__general_gameplay_tab_name: "NVE Pack"
 ## General Gameplay (general_gameplay_setting) Group
 no_void_economy__general_gameplay_tab__general_gameplay_setting_name: "General Gameplay"
 no_void_economy__general_gameplay_imperial_hubris_name: "(In development) Imperial Hubris - Empire military might weakens"
 no_void_economy__general_gameplay_imperial_hubris_desc: "Implement Empire Military Difficulties"
 no_void_economy__general_gameplay_war_exhaustion_name: "(In development)  War Exhaustion - Political Pressure"
 no_void_economy__general_gameplay_war_exhaustion_desc: "Implement War Impact on a country stability & a governement Legitimacy"
 no_void_economy__activate_trade_cost_name: "(In development) Trade Rework"
 no_void_economy__activate_trade_cost_desc: "The trade profit will be the difference of price between two markets."
 no_void_economy__nve_no_void_economy_main_name: "Only sold goods create revenue (NVE)"
 no_void_economy__nve_no_void_economy_main_desc: "Controls how broadly NVE applies its no-void-economy logic."
 no_void_economy__nve_no_void_economy_main_option_1_name: "Activate (Performance Mode)"
 no_void_economy__nve_no_void_economy_main_option_1_desc: "Detailed country-market accounting is kept for human-played countries in their relevant markets. Other supported activity falls back to lighter market-level accounting. Recommended for smoother gameplay."
 no_void_economy__nve_no_void_economy_main_option_2_name: "Activate (Normal Mode)"
 no_void_economy__nve_no_void_economy_main_option_2_desc: "Detailed country-market accounting remains broadly available. More complete for diagnostics, but heavier."
 no_void_economy__nve_no_void_economy_main_option_3_name: "Deactivated"
 no_void_economy__nve_no_void_economy_main_option_3_desc: "Disables the main NVE economic behavior where supported."
 no_void_economy__nve_subjects_persistance_name: "(In development) Persistence of resources"
 no_void_economy__nve_subjects_persistance_desc: ""
 ## NVE  (nve_general_trade_rework) Group
 no_void_economy__general_gameplay_tab__nve_general_trade_rework_name: "NVE "
 no_void_economy___name: "Only good that are sold generate an income"
 no_void_economy___desc: ""
 no_void_economy___name: "Boycotts"
 no_void_economy___desc: "Embargoed & Wars opponents are blocked from buying resources of a country even if the country don't own the Market Center"

 # Economic Balance (nve_balance) Tab
 no_void_economy__nve_balance_name: "Economic Balance"
 ## Economy (nve_balance_economy) Group
 no_void_economy__nve_balance__nve_balance_economy_name: "Economy"
 no_void_economy__nve_balance_economy_location_specialisation_name: "(In development) Increased Location Specialisation"
 no_void_economy__nve_balance_economy_location_specialisation_desc: ""
 no_void_economy__nve_balance_economy_main_balance_name: "(In development) Sliders adjustments"
 no_void_economy__nve_balance_economy_main_balance_desc: ""
 no_void_economy__nve_balance_ai_strategy_name: "(In development) Extra revenue to AI to compensate for lack of strategy"
 no_void_economy__nve_balance_ai_strategy_desc: ""
 no_void_economy__nve_decay_activate_name: "(In development) Activate Goods Decay"
 no_void_economy__nve_decay_activate_desc: "Stocks will decay 1% each month."

 # Difficulty levels (nve_rebels_n_subjects) Tab
 no_void_economy__nve_rebels_n_subjects_name: "Difficulty levels"
 ## Subjects (Subjects) Group
 no_void_economy__nve_rebels_n_subjects__Subjects_name: "Subjects"
 no_void_economy__nve_balance_difficulty_name: "Difficulty (Read tooltip carefully)"
 no_void_economy__nve_balance_difficulty_desc: "Set a difficulty level."
 no_void_economy__nve_balance_difficulty_option_1_name: "Hard (Historical, you may lose wars)"
 no_void_economy__nve_balance_difficulty_option_2_name: "Normal (Gameful, you might blob)"
 ## Rebels (nve_rebels) Group
 no_void_economy__nve_rebels_n_subjects__nve_rebels_name: "Rebels"
 no_void_economy__nve_rebel_threshold_name: "(In development) Adjust Rebel Threshold"
 no_void_economy__nve_rebel_threshold_desc: ""
 no_void_economy__nve_rebel_war_start_name: "(In development) Overlord declares war"
 no_void_economy__nve_rebel_war_start_desc: ""
 no_void_economy__nve_balance_war_shorter_name: "(In development) Shorter Wars"
 no_void_economy__nve_balance_war_shorter_desc: "AI will be smarter in peace acceptance."

 # Debug & Audit (nve_general) Tab
 no_void_economy__nve_general_name: "Debug & Audit"
 ## Debug & Audit (nve_general_performance) Group
 no_void_economy__nve_general__nve_general_performance_name: "Debug & Audit"
 no_void_economy__nve_debug_messages_name: "Debug Messages"
 no_void_economy__nve_debug_messages_desc: "Controls optional NVE diagnostic messages. Important consistency errors are still reported even when this is off."
 no_void_economy__nve_debug_messages_option_1_name: "Off (Recommended)"
 no_void_economy__nve_debug_messages_option_1_desc: "Hide optional NVE debug messages. Recommended for normal gameplay."
 no_void_economy__nve_debug_messages_option_2_name: "Basic"
 no_void_economy__nve_debug_messages_option_2_desc: "Show useful NVE status messages, including setup checks, package state, stock consistency issues, and fallback use."
 no_void_economy__nve_debug_messages_option_3_name: "Detailed Logs - Slow"
 no_void_economy__nve_debug_messages_option_3_desc: "Warning: shows detailed economic debug messages, including inputs, stock changes, and diagnostic values. This can create heavy log output and may reduce smoothness during monthly ticks."
 no_void_economy__nve_monthly_stock_check_name: "Monthly Stock Check"
 no_void_economy__nve_monthly_stock_check_desc: "Controls whether NVE runs an additional stock consistency check every month."
 no_void_economy__nve_monthly_stock_check_option_1_name: "Off (Recommended)"
 no_void_economy__nve_monthly_stock_check_option_1_desc: "Do not run the heavier monthly stock check. Recommended for normal gameplay. Manual debug checks and long-term consistency checks remain available."
 no_void_economy__nve_monthly_stock_check_option_2_name: "NVE monthly audit enabled"
 no_void_economy__nve_monthly_stock_check_option_2_desc: "Monthly audit mode can add a noticeable performance cost. Prefer leaving it disabled outside dedicated validation runs."
 no_void_economy__nve_save_mode_name: "Save mode"
 no_void_economy__nve_save_mode_desc: "Controls how much NVE economic state is kept between monthly ticks."
 no_void_economy__nve_save_mode_option_1_name: "Light Save (Recommended)"
 no_void_economy__nve_save_mode_option_1_desc: "Keeps only the economic data needed for gameplay. Recommended for better performance, especially during monthly ticks."
 no_void_economy__nve_save_mode_option_2_name: "Balanced Save"
 no_void_economy__nve_save_mode_option_2_desc: "Keeps more economic detail for markets connected to human-played countries, while limiting saved data elsewhere. Good balance between economic tracking and game smoothness."
 no_void_economy__nve_save_mode_option_3_name: "NVE complete save mode enabled"
 no_void_economy__nve_save_mode_option_3_desc: "Complete save mode preserves extra diagnostic state and can increase save size and monthly processing cost."

