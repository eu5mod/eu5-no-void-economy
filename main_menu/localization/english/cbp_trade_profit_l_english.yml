l_english:
 AUTO_MODIFIER_NAME_cbp_trade_profit_selling_efficiency_cancellation: "(CBP) Selling Efficiency Route Loss"
 AUTO_MODIFIER_DESC_cbp_trade_profit_selling_efficiency_cancellation: "Cancels the native Selling Efficiency baseline and replaces it with a diminishing CBP trade-loss coefficient."

 AUTO_MODIFIER_NAME_cbp_trade_profit_import_efficiency_cancellation: "(CBP) Import Efficiency Redirected"
 AUTO_MODIFIER_DESC_cbp_trade_profit_import_efficiency_cancellation: "Removes Import Efficiency from absolute trade-price formation and redirects its value to reciprocal Trade Maintenance."

 AUTO_MODIFIER_NAME_cbp_trade_profit_export_efficiency_cancellation: "(CBP) Export Efficiency Redirected"
 AUTO_MODIFIER_DESC_cbp_trade_profit_export_efficiency_cancellation: "Removes Export Efficiency from absolute trade-price formation and redirects its value to reciprocal Trade Maintenance."

 AUTO_MODIFIER_NAME_cbp_trade_profit_merchant_maintenance_reconciliation: "(CBP) Reciprocal Trade Maintenance"
 AUTO_MODIFIER_DESC_cbp_trade_profit_merchant_maintenance_reconciliation: "Applies Trade Maintenance as one minus the reciprocal of one plus half native maintenance plus five times combined Import and Export Efficiency."
